<style>
  /* ---------- Theme tokens (changed by the Settings panel) ---------- */
  :root{
    --bg:#FAF6EF;
    --panel:#FFFDF8;
    --ink:#2B2B2B;
    --muted:#5A5A5A;
    --line:#D8D2C6;
    --accent:#2E6B5E;         /* calm green */
    --accent-soft:#DDEBE6;
    --warm:#8A5A2B;
    --warm-soft:#F3E4D2;
    --focus:#1B5FA8;
    --fs:19px;                /* base font size, A- / A+ change this */
    --track:0em;              /* letter-spacing, dyslexia spacing toggle */
    --wordtrack:0em;          /* word-spacing */
    --font: Lexend, "Lexend Deca", Verdana, Tahoma, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:var(--fs);
    line-height:1.6;
    letter-spacing:var(--track);
    word-spacing:var(--wordtrack);
    text-align:left;
    padding-bottom:120px;
  }
  p,li,td,th,label,button,input,textarea,select{
    font-family:var(--font);
    letter-spacing:var(--track);
    word-spacing:var(--wordtrack);
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  /* ---------- Header ---------- */
  header{
    background:var(--panel);
    border-bottom:2px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;max-width:820px;margin:0 auto}
  .logo{font-weight:700;font-size:1.05em;margin-right:auto}
  .hdr button{min-height:48px}

  /* ---------- Buttons ---------- */
  button{
    font-size:1em;
    min-height:48px;
    padding:10px 16px;
    border-radius:12px;
    border:2px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  button:hover{background:var(--accent-soft)}

    outline:4px solid var(--focus);

  }
  .btn-main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .btn-main:hover{background:#245549}
  .btn-listen{background:var(--warm-soft);border-color:#DEC5A4;font-weight:700;white-space:nowrap}
  .btn-listen:hover{background:#EBD8BF}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .small{font-size:0.82em;min-height:40px;padding:6px 10px}

  /* ---------- Nav ---------- */
  nav{background:var(--panel);border-bottom:2px solid var(--line);position:sticky;top:69px;z-index:19}
  .navin{display:flex;gap:8px;max-width:820px;margin:0 auto;padding:8px 18px;overflow-x:auto}
  nav button{
    flex:1 1 0;min-width:96px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:0.8em;line-height:1.2;padding:8px 6px;
  }
  nav button .ic{font-size:1.5em;line-height:1}
  nav button[aria-current="page"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

  /* ---------- Cards & panels ---------- */
  .card{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin:16px 0;
  }
  .taskcard{display:flex;align-items:center;gap:14px;width:100%;font-size:1.05em;padding:18px}
  .taskcard .ic{font-size:1.8em}
  .taskcard.done{background:var(--accent-soft);border-color:var(--accent)}

  h1{font-size:1.5em;margin:20px 0 4px}
  h2{font-size:1.2em;margin:18px 0 6px}
  .sub{color:var(--muted);margin:0 0 10px}
  .chunk{font-size:1.15em;margin:0 0 6px}

  .rowline .txt{flex:1}
  .pill{display:inline-block;background:var(--accent-soft);border-radius:999px;padding:2px 12px;font-size:0.8em;color:var(--muted)}
  .note{background:var(--warm-soft);border:2px solid #DEC5A4;border-radius:12px;padding:12px 14px;margin:14px 0}
  .good{background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;margin:14px 0}
  .hidden{display:none !important}
  .word-big{font-size:2.1em;font-weight:700;letter-spacing:0.04em;margin:8px 0}
  .chunks{font-size:1.6em;letter-spacing:0.06em;color:var(--warm);font-weight:700}
  .hi{background:#FFE9A8;padding:0 3px;border-radius:4px}
  .tiles{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .tile{font-size:1.3em;font-weight:700;padding:12px 18px;border-radius:12px}

         border:3px dashed var(--line);border-radius:12px;padding:10px 14px;background:#fff}
  input[type=text], textarea{
    font-size:1.15em;padding:12px;border:2px solid var(--line);border-radius:12px;
    background:#fff;color:var(--ink);width:100%;max-width:22em;min-height:52px;
  }
  textarea{max-width:100%;min-height:130px;line-height:1.7}
  .opt{display:block;width:100%;margin:8px 0}
  .opt.picked{border-color:var(--accent);background:var(--accent-soft)}
  .stat{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .statnum{font-size:1.7em;font-weight:700;color:var(--accent);min-width:2.2em}
  .badge{display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:110px;
         padding:12px 6px;border:2px solid var(--line);border-radius:14px;margin:6px;text-align:center;font-size:0.8em}
  .badge .ic{font-size:1.9em}
  .badge.on{background:var(--accent-soft);border-color:var(--accent)}
  .badge.off{opacity:0.4}
  table{border-collapse:collapse;width:100%;margin:10px 0}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;font-size:0.9em}
  th{background:var(--accent-soft)}
  footer{margin:40px 0 0;padding:16px 0;border-top:1px solid var(--line);color:var(--muted);font-size:0.8em}
  footer button{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;min-height:auto}
  .bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--accent)}
  @media (prefers-reduced-motion: no-preference){
    .card, .good {transition:background 160ms ease}
  }
  @media (max-width:560px){
    nav button{min-width:74px;font-size:0.7em}
    .navin{padding:8px 10px}
  }
</style>
</head>

  const tidy = s => String(s == null ? "" : s)
    .normalize("NFC")
    .replace(/[ ​\s]/g, "")   /* nbsp, zero-width, any whitespace */
    .replace(/[^\p{L}'’-]/gu, "")       /* keep letters, apostrophes, hyphens */
    .replace(/[’]/g, "'")
    .toLowerCase();
  return tidy(a) === tidy(b) && tidy(a) !== "";
}

let S = load();
CURRENT_UNIT = UNITS[S.unit] ? S.unit : DEFAULT_UNIT;
S.unit = CURRENT_UNIT;
U = UNITS[CURRENT_UNIT];
let PROG = unitState(CURRENT_UNIT);   /* progress for the live unit */

/* Turn anything we might read (a fresh start, a current save, or a save from
   before units existed) into the current shape. A pre-units save has its
   progress folded into Unit 1, so nobody loses a term's work to an update. */
function hydrate(obj){
  const st = Object.assign(clone(defaultState), obj || {});
  st.units = st.units || {};
  const legacy = {}; let hasLegacy = false;
  UNIT_KEYS.forEach(function(k){
    if(obj && Object.prototype.hasOwnProperty.call(obj, k)){ legacy[k] = obj[k]; hasLegacy = true; }
    delete st[k];
  });
  if(hasLegacy && !Object.keys(st.units).length){
    st.units["1"] = Object.assign(clone(defaultUnitState), legacy);
  }
  if(!UNITS[st.unit]) st.unit = DEFAULT_UNIT;
  return st;
}

/* The progress block for one unit, created on first use. Returns the object
   that lives inside S, not a copy, so ordinary writes still save. */
function unitState(n){
  const k = String(n);
  S.units[k] = Object.assign(clone(defaultUnitState), S.units[k] || {});
  return S.units[k];
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return hydrate(raw ? JSON.parse(raw) : null);
  }catch(e){ return hydrate(null); }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function markToday(){
  const d = new Date().toISOString().slice(0,10);
  if(!S.daysPracticed.includes(d)){ S.daysPracticed.push(d); save(); }
}

/* Invisible usage diary — one row of counters per day, teacher view only.
   Keys: pages (pages turned), listens (Listen taps), words (newly mastered),
   qa/q1 (comprehension answers / right first try), va/vr (vocab answers/right),
   ga/gr (grammar answers/right), end (new story endings). No timers — counts only. */
function bump(key, n){
  const d = new Date().toISOString().slice(0,10);
  if(!S.log[d]) S.log[d] = {};
  S.log[d][key] = (S.log[d][key] || 0) + (n == null ? 1 : n);
  save();
}

/* ---------------- Speech ---------------- */
let VOICES = [], VOICE_OK = null;

function loadVoices(){
  VOICES = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || [];
  const en = VOICES.filter(v => (v.lang||"").toLowerCase().startsWith("en"));
  VOICE_OK = en.length > 0;
  return en;
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = () => { loadVoices(); if(S.section==="today") render(); };
}
/* Preferred voice, in order. Ava (Premium) is macOS-only; on the iPad, an Enhanced/Premium iOS voice
   if it is ever missing, fall back to the next best rather than the robot. */
const VOICE_WISHLIST = [/ava.*(premium|enhanced)/i, /ava/i, /(premium|enhanced)/i];

function pickVoice(en){
  if(S.settings.voice){
    const saved = en.find(v => v.name === S.settings.voice);
    if(saved) return saved;                       /* teacher's explicit choice wins */
  }
  for(const want of VOICE_WISHLIST){
    const hit = en.find(v => want.test(v.name));
    if(hit) return hit;
  }
  return en[0];
}

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = S.settings.rate;
  u.pitch = 1;
  const en = loadVoices();
  const chosen = pickVoice(en);
  if(chosen) u.voice = chosen;
  u.lang = chosen ? chosen.lang : "en-GB";
  speechSynthesis.speak(u);
}
let READALONG = false;
function stopSpeech(){
  READALONG = false;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(PLAYER){ PLAYER.pause(); PLAYER = null; }
}

  "On the first steam train": "audio/adv-on-the-first-steam-train-94f39b11.mp3",
  "I get to the schoolhouse first, before the sun is warm. But something is wrong. The school bell is not on its hook! Without the bell, no one knows school has begun. In my bag I have my slate, my chalk, and one bread roll.": "audio/adv-i-get-to-the-schoolhouse-first-before-the-b903bb9e.mp3",

  "I look by the gate. I look under the steps. Then I see them — little hoof prints in the dust, going round the corner. And far off, I hear a tiny jingle. Jingle, jingle.": "audio/adv-i-look-by-the-gate-i-look-under-the-steps-7ff52005.mp3",

  "Behind the corner stands the farmer's goat, chewing grass — with the school bell tied to her collar! The farmer laughs and says she pulls it off its hook every spring. I lead her back and ring the bell myself. Everyone cheers when they hear it.": "audio/adv-behind-the-corner-stands-the-farmer-s-goat-38108bdb.mp3",
  "You found an ending: The Bell Finder! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-bell-finder-well-d-e778747b.mp3",
  "I run from door to door, polite and quick. 'School is starting! Pass it on!' Each family tells the next one, and soon the whole lane is walking to school together, laughing in the morning sun. The teacher shakes my hand at the gate.": "audio/adv-i-run-from-door-to-door-polite-and-quick-s-3d24edde.mp3",
  "You found an ending: The Early Bird! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-early-bird-well-do-518444e2.mp3",

  "Run and tell everyone yourself": "audio/adv-run-and-tell-everyone-yourself-db2ab5e9.mp3",
  "Rat-a-tat-tat! I drum on the school steps, loud and steady. Doors open all down the lane. The children come running to see, and school starts right on time. The teacher says my drumming was the finest school bell she ever heard.": "audio/adv-rat-a-tat-tat-i-drum-on-the-school-steps-l-2900f31c.mp3",
  "You found an ending: The Drummer! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-drummer-well-done-df945111.mp3",
  "I work in the big house on the hill. Today the cook is ill, and twelve visitors are coming for tea! In my apron I have a wooden spoon, the cook's list, and one lucky penny.": "audio/adv-i-work-in-the-big-house-on-the-hill-today-5a0eabab.mp3",

  "The list says: bread, jam tarts, one big cake. I light nothing by myself — the fire is already warm. I mix and stir, stir and mix. But the flour bag is nearly empty!": "audio/adv-the-list-says-bread-jam-tarts-one-big-cake-d990cffe.mp3",

  "My little jam tarts come out golden and sweet. The visitors say they never ate finer, and one lady asks for the recipe! The cook sits up in bed and smiles when she hears. 'You kept your head,' she says. 'That is what real cooks do.'": "audio/adv-my-little-jam-tarts-come-out-golden-and-sw-a4c498a9.mp3",
  "You found an ending: The Little Cook! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-little-cook-well-d-43b6e75f.mp3",
  "'Together we are quick!' The gardener carries, the maid pours, my friends pass baskets hand to hand up the hill. The tea is perfect, and everyone helped make it. The lady of the house says a good leader made it happen. She means me!": "audio/adv-together-we-are-quick-the-gardener-carries-e91ef12a.mp3",
  "You found an ending: The Team Captain! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-team-captain-well-9b7a1317.mp3",

  "Up the hill, down the hill, basket after basket. My legs burn, but the tea table fills up just in time. The visitors never guess a thing. The baker gives me a warm roll for my trouble, and it tastes like a gold medal.": "audio/adv-up-the-hill-down-the-hill-basket-after-bas-666540ca.mp3",
  "You found an ending: The Fast Runner! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-fast-runner-well-d-e66288e9.mp3",

  "The map skips and flips like a white bird. It sticks to the wet rail, right where the deck ends and the sea begins. The wind holds its breath. One chance.": "audio/adv-the-map-skips-and-flips-like-a-white-bird-4cf69e64.mp3",

  "I drop to my knees, slap my ribbon over the map, and tie it fast to the rail. The captain unties it with a grin as wide as the sea. 'This map finds the new land,' he says, 'and you found the map.' He lets me hold the wheel while the sun comes out.": "audio/adv-i-drop-to-my-knees-slap-my-ribbon-over-the-225006a9.mp3",
  "You found an ending: The Map Catcher! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-map-catcher-well-d-351afa8e.mp3",
  "My knots hold through every wave. Not one barrel slides, not one map is lost. When the sea goes flat, the bosun checks each knot and whistles. 'Neat as a spider's web,' he says. He teaches me the secret sailor's knot, and now I teach it to you: practise, practise, practise.": "audio/adv-my-knots-hold-through-every-wave-not-one-b-4f65e824.mp3",
  "You found an ending: The Knot Master! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-knot-master-well-d-c7f984d1.mp3",
  "'Tie down the barrels!' calls the captain. I know six good knots. I tie and pull, tie and pull. Then, through the spray, I see a light far away, blinking slow and calm.": "audio/adv-tie-down-the-barrels-calls-the-captain-i-k-d300a869.mp3",

  "'A lighthouse!' I shout. 'Land that way!' The captain turns the wheel, and the ship slides into a calm bay just as the storm breaks behind us. That night the sailors sing a song about the little sailor with the sharp eyes. I know all the words. They are about me.": "audio/adv-a-lighthouse-i-shout-land-that-way-the-cap-e823264d.mp3",

  "Today is the very first trip of the new steam train! Flags wave, and the whole town cheers. But as we roll along, I see something from my window: the signal lamp by the bridge is dark. It should be lit. I have a lantern, a red scarf, and loud lungs.": "audio/adv-today-is-the-very-first-trip-of-the-new-st-75309cf9.mp3",

  "Wave your red scarf out the window": "audio/adv-wave-your-red-scarf-out-the-window-321b997f.mp3",
  "I carry my lantern down the rocking corridor, careful as a cat. The guard is at the very end of the train, checking his big silver watch.": "audio/adv-i-carry-my-lantern-down-the-rocking-corrid-824200e4.mp3",
  "Tell him about the dark signal": "audio/adv-tell-him-about-the-dark-signal-819e4422.mp3",
  "Ask him to take you to the driver": "audio/adv-ask-him-to-take-you-to-the-driver-070374cb.mp3",
  "The guard sees my lantern and understands at once. He swings his own lamp, the driver slows the train, and we roll gently to the bridge while the signalman relights the big lamp. 'Bright thinking,' says the guard, and he pins his silver whistle on my coat.": "audio/adv-the-guard-sees-my-lantern-and-understands-699ec100.mp3",
  "You found an ending: The Lantern Bearer! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-lantern-bearer-wel-83ef38d1.mp3",
  "The driver lets me stand beside him while he slows the great engine — hiss, puff, hiss. The signal is lit again, and we cross the bridge to the biggest cheer of the day. Then he lets me pull the whistle cord. Whoo-whoo! Best sound in the world.": "audio/adv-the-driver-lets-me-stand-beside-him-while-a8b63691.mp3",
  "You found an ending: The Driver's Friend! Well done. You kept your hero safe.": "audio/adv-you-found-an-ending-the-driver-s-friend-we-16c6c983.mp3",
  "My red scarf snaps and flutters in the wind like a flag. The people on the platform ahead see it and point. A man in a blue coat starts running along the line.": "audio/adv-my-red-scarf-snaps-and-flutters-in-the-win-a0d430d8.mp3",

let PLAYER = null;

function playClip(src){
  if(PLAYER){ PLAYER.pause(); PLAYER = null; }
  PLAYER = new Audio(src);
  PLAYER.playbackRate = S.settings.rate < 0.9 ? 0.9 : 1;
  PLAYER.play().catch(()=>{});   /* if the clip is missing, fall back quietly */
  return PLAYER;
}
function say(text){
  const clip = AUDIO[text];
  if(clip){
    const p = playClip(clip);
    p.onerror = ()=> speak(text);
    return;
  }
  speak(text);
}

/* Speak (or play a clip) and run a callback when it finishes.
   Used by read-along so the on-screen text keeps pace with the voice. */
function sayThen(text, done){
  const clip = AUDIO[text];
  if(clip){
    const p = playClip(clip);
    p.onended = ()=> done && done();
    p.onerror = ()=> speakThen(text, done);
    return;
  }
  speakThen(text, done);
}
function speakThen(text, done){
  if(!window.speechSynthesis){ done && done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = S.settings.rate; u.pitch = 1;
  const en = loadVoices(); const chosen = pickVoice(en);
  if(chosen) u.voice = chosen;
  u.lang = chosen ? chosen.lang : "en-GB";
  u.onend = ()=> done && done();
  speechSynthesis.speak(u);
}

/* A Listen button, always the same shape, always in the same place. */
function listenBtn(text, label){
  const b = el("button","btn-listen");
  b.type = "button";
  b.innerHTML = "🔊 " + (label || "Listen");
  b.setAttribute("aria-label","Listen: " + text.slice(0,60));
  b.onclick = () => { bump("listens"); say(text); };
  return b;
}

/* ---------------- Tiny DOM helpers ---------------- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function add(parent, ...kids){ kids.forEach(k => k && parent.appendChild(k)); return parent; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

/* ---------------- Settings ---------------- */
const BGS = { cream:"#FAF6EF", blue:"#EAF2F8", yellow:"#FBF3D5" };

function applySettings(){
  const r = document.documentElement.style;
  r.setProperty("--fs", S.settings.fs + "px");
  r.setProperty("--bg", BGS[S.settings.bg] || BGS.cream);
  r.setProperty("--track", S.settings.spacing ? "0.05em" : "0em");
  r.setProperty("--wordtrack", S.settings.spacing ? "0.15em" : "0em");
}

function settingsPanel(){
  const c = el("section","card");
  add(c, el("h2",null,"Settings"));

  const mk = (labelText, node) => {
    const w = el("div"); w.style.margin = "14px 0";
    const l = el("div",null,labelText); l.style.fontWeight = "700";
    add(w, l, node); return w;
  };

  const bgRow = el("div","btn-row");
  [["cream","Cream"],["blue","Pale blue"],["yellow","Pale yellow"]].forEach(([k,name])=>{
    const b = el("button",null,name);
    if(S.settings.bg===k) b.classList.add("btn-main");
    b.onclick = ()=>{ S.settings.bg=k; save(); applySettings(); render(); };
    add(bgRow,b);
  });

  const spaceBtn = el("button", null, S.settings.spacing ? "Wide spacing: ON" : "Wide spacing: OFF");
  if(S.settings.spacing) spaceBtn.classList.add("btn-main");
  spaceBtn.onclick = ()=>{ S.settings.spacing = !S.settings.spacing; save(); applySettings(); render(); };

  const rateRow = el("div","btn-row");
  [[0.7,"Slow"],[0.85,"Steady"],[1.0,"Normal"]].forEach(([v,name])=>{
    const b = el("button",null,name);
    if(Math.abs(S.settings.rate - v) < 0.01) b.classList.add("btn-main");
    b.onclick = ()=>{ S.settings.rate=v; save(); render(); speak("This is my reading speed."); };
    add(rateRow,b);
  });

  const en = loadVoices();
  let voiceNode;
  if(en.length){
    const sel = el("select");
    sel.style.cssText = "font-size:1em;padding:10px;border-radius:12px;border:2px solid var(--line);min-height:48px;max-width:100%";
    en.forEach(v=>{
      const o = el("option",null, v.name + " (" + v.lang + ")");
      o.value = v.name;
      if(v.name === S.settings.voice) o.selected = true;
      add(sel,o);
    });
    const auto = pickVoice(en);
    if(!S.settings.voice && auto) sel.value = auto.name;   /* show what is really being used */
    sel.onchange = ()=>{ S.settings.voice = sel.value; save(); speak("Hello. I will read for you."); };
    const row = el("div","rowline");
    add(row, sel, listenBtn("Hello. I will read for you.","Test"));
    voiceNode = el("div");
    add(voiceNode, row);
    add(voiceNode, el("p","sub", auto && /ava/i.test(auto.name)
      ? "Using Ava. Good."
      : "Ava was not found on this computer, so a different voice is being used. Install Ava (Premium) in System Settings \u2192 Accessibility \u2192 Read & Speak \u2192 System voice \u2192 \u24d8"));
  } else {
    voiceNode = el("p","sub","No English voice was found on this computer yet. See the note on the Today page.");
  }

  add(c,
    mk("Background colour", bgRow),
    mk("Letter and word spacing", spaceBtn),
    mk("Reading speed", rateRow),
    mk("Voice", voiceNode)
  );
  return c;
}

let VIEW = { reading: PROG.reading || null, word:null, vocab:null, sub:null };

function go(section, idx){
  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  S.section = section;
  if(section==="reading"){
    /* Resume where he left off if he is coming back to the same passage;
       otherwise start the chosen passage fresh. */
    if(PROG.reading && (idx == null || PROG.reading.p === idx) && PROG.reading.phase !== "done"){
      VIEW.reading = PROG.reading;
    } else {
      VIEW.reading = { p: idx||0, chunk:0, phase:"read", q:0 };
    }
  }
  if(section==="word"){ WORD_MENU = false; startWordSession(idx||0); }
  if(section==="grammar"){ GRAMMAR_MENU = false; startGrammarSet(idx||0); }
  if(section==="vocab")   VIEW.vocab = { mode:"learn", i:0, quizI:0, picked:null };
  save(); render(); window.scrollTo(0,0);
}

  add(test, el("h2",null,"Sound check"));

  const tr = el("div","btn-row");
  add(tr, listenBtn("Hello. I am ready to read with you today.","Test the sound"));
  add(test,tr);
  add(f,test);

  add(f, pupCard());

  /* Pick up where he left off in a passage. */
  if(PROG.reading && PROG.reading.phase === "read" && PROG.reading.chunk > 0){
    const P = U.passages[PROG.reading.p];
    const resume = el("button","taskcard");
    resume.style.borderColor = "var(--accent)";
    add(resume, el("span","ic","▶️"),

    resume.onclick = ()=> go("reading", PROG.reading.p);
    add(f, el("h2",null,"Carry on"));
    add(f, resume);
  }

  add(f, el("h2",null,"Your tasks"));
  U.tasks.forEach(t=>{
    const done = !!PROG.tasksDone[t.id];
    const b = el("button","taskcard" + (done ? " done":""));
    add(b, el("span","ic",t.icon), el("span",null,t.label));

    const row = el("div","rowline");
    add(row, b, listenBtn(t.label));
    add(f,row);
  });

  const all = U.tasks.every(t=>PROG.tasksDone[t.id]);
  if(all){
    const g = el("div","good");
    add(g, el("p","prose","All your tasks are done. Well done today."));
    add(f,g);
  }
  return f;
}

/* ===================== HUSKY PUP (Today companion) =====================
   A motivation layer, not an activity. The pup collects gear as his
   cumulative wins grow. Wins only ever go up, so the pup never loses
   anything and is never disappointed — only ever more pleased. */
const PUP_NAMES = ["Miko", "Luna", "Snowy", "Pancake"];
const PUP_GEAR = [
  [5,  "🧣", "a warm scarf"],
  [12, "🎒", "a little satchel"],
  [20, "🏮", "a lantern"],
  [30, "🗺️", "a map"],
  [45, "🧭", "a compass"],
  [60, "🎖️", "a hero medal"]
];

/* Count something across every unit the student has opened. Used wherever a
   number is promised never to go down. */
function acrossUnits(key, sub){
  return Object.keys(S.units).reduce(function(n, k){
    const u = S.units[k] || {};
    const box = sub ? ((u[key] || {})[sub] || {}) : (u[key] || {});
    return n + Object.keys(box).length;
  }, 0);
}

/* Move the app to another unit. Everything for the old unit stays where it
   is; the student simply sees the other one from now on. */
function switchUnit(n){
  if(!UNITS[n]) return;
  S.unit = String(n) === String(Number(n)) ? Number(n) : n;
  CURRENT_UNIT = S.unit;
  U = UNITS[CURRENT_UNIT];
  PROG = unitState(CURRENT_UNIT);
  WS = null;
  ORDER_PICK = [];                 /* the warm-up belongs to the old unit */
  VIEW = { reading: PROG.reading || null, word:null, vocab:null, sub:null };
  S.section = "today";
  SHOW_TEACHER = false; SHOW_SETTINGS = false;
  save(); stopSpeech(); startWordSession(0); render(); window.scrollTo(0,0);
}

function pupScore(){
  return S.daysPracticed.length
       + acrossUnits("passagesDone")
       + Object.keys(S.wordsMastered).length
       + Object.keys(S.vocabSeen).length
       + acrossUnits("grammarDone")
       + acrossUnits("adventure", "endings");
}

function pupCard(){
  const c = el("section","card");

  /* first visit: he names the pup (tap, no typing) */
  if(!S.pup.name){
    add(c, el("h2",null,"🐶 A husky pup has joined you!"));
    const msg = "This little husky will keep you company while you read. What will you call your pup?";
    add(c, el("p","prose",msg));
    const row = el("div","btn-row");
    PUP_NAMES.forEach(n=>{
      const b = el("button",null,n);
      b.onclick = ()=>{ S.pup.name = n; save(); render(); };
      add(row,b);
    });
    add(c,row);
    const lr = el("div","btn-row");
    add(lr, listenBtn(msg + " " + PUP_NAMES.join(", or ") + "?"));
    add(c,lr);
    return c;
  }

  const name = S.pup.name;
  const sc = pupScore();
  const earned = PUP_GEAR.filter(g => sc >= g[0]);
  const next = PUP_GEAR.find(g => sc < g[0]);

  const top = el("div","rowline");
  const pup = el("span",null,"🐶");
  pup.style.fontSize = "52px";
  pup.setAttribute("aria-hidden","true");
  const label = el("span");
  const line1 = el("div"); line1.style.fontWeight = "700";
  line1.textContent = name + (earned.length ? "  " + earned.map(g=>g[1]).join(" ") : "");
  const line2 = el("div","sub"); line2.style.margin = "2px 0 0";
  line2.textContent = sc === 0
    ? name + " is ready when you are."
    : name + " is proud of you. You have " + sc + " win" + (sc===1?"":"s") + " together.";
  add(label, line1, line2);
  add(top, pup, label);
  add(c, top);

  let say2 = "";
  if(next){
    say2 = "Next up: " + next[2] + " for " + name + " at " + next[0] + " wins.";
    add(c, el("p","sub", next[1] + " " + say2));
  } else {
    say2 = name + " has every piece of gear. What a team.";
    add(c, el("p","sub","🎖️ " + say2));
  }
  const lr = el("div","btn-row");
  add(lr, listenBtn(line2.textContent + " " + say2));
  add(c,lr);
  return c;
}

/* Play the passage from the current chunk to the end, advancing the visible
   text as each chunk finishes so the page follows the voice. */
function startReadAlong(){
  const v = VIEW.reading;
  const P = U.passages[v.p];
  READALONG = true;
  render();
  const speakCurrent = ()=>{
    if(!READALONG) return;
    sayThen(P.chunks[v.chunk], ()=>{
      if(!READALONG) return;
      if(v.chunk < P.chunks.length - 1){
        v.chunk++; bump("pages");
        render();            /* turn the page, then keep reading */
        speakCurrent();
      } else {
        READALONG = false;
        render();            /* finished — show the normal buttons again */
      }
    });
  };
  speakCurrent();
}

/* Open the passage chooser (the menu of Passage 1, Passage 2, …). */

  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  S.section = "reading";
  VIEW.reading = { p: (VIEW.reading ? VIEW.reading.p : 0), chunk:0, phase:"pick", q:0 };
  render(); window.scrollTo(0,0);
}

  const f = document.createDocumentFragment();
  const v = VIEW.reading || (VIEW.reading = { p:0, chunk:0, phase:"pick", q:0 });
  const P = U.passages[v.p];

  /* passage picker — one big card per passage: Passage 1, Passage 2, … */
  if(v.phase === "pick"){
    add(f, el("h1",null,"Reading"));
    add(f, el("p","sub","Choose a passage."));
    U.passages.forEach((p,i)=>{
      const done = !!PROG.passagesDone[i];
      const here = PROG.reading && PROG.reading.p === i && PROG.reading.phase === "read" && PROG.reading.chunk > 0;

      let status = "New";
      if(done) status = "✓ Done";
      else if(here) status = "Keep going — page " + (PROG.reading.chunk+1);

      const b = el("button","taskcard" + (done ? " done":""));
      const label = el("span");
      const line1 = el("div"); line1.style.fontWeight = "700";
      line1.textContent = "Passage " + (i+1) + ": " + p.title;
      const line2 = el("div","sub"); line2.style.margin = "2px 0 0";
      line2.textContent = status;
      add(label, line1, line2);
      add(b, el("span","ic","📖"), label);
      if(done) add(b, el("span","tick","✓"));

      b.onclick = ()=> go("reading", i);   /* resumes this passage if in progress */

      const row = el("div","rowline");
      add(row, b, listenBtn("Passage " + (i+1) + ". " + p.title + ". " + p.blurb));
      add(f,row);
    });
    return f;
  }

  add(f, el("h1",null,P.title));

  if(v.phase === "read"){
    const total = P.chunks.length;
    add(f, el("p","sub","Page " + (v.chunk+1) + " of " + total));
    const bar = el("div","bar"); const i = el("i"); i.style.width = ((v.chunk+1)/total*100)+"%"; add(bar,i);
    add(f,bar);

    const c = el("section","card prose");
    add(c, el("p","chunk", P.chunks[v.chunk]));
    const row = el("div","btn-row");
    add(row, listenBtn(P.chunks[v.chunk], "Listen to Page"));

    /* Plays from here to the end, turning the pages with the voice
       so the words on screen always match what he hears. */
    const along = el("button","btn-listen", READALONG ? "⏸ Stop" : "🔊 Listen to Whole Passage");
    along.type = "button";
    along.onclick = ()=>{
      if(READALONG){ stopSpeech(); render(); return; }
      startReadAlong();
    };
    add(row, along);
    add(c,row);
    add(f,c);

    const nav = el("div","btn-row");
    const back = el("button",null,"← Back");
    back.disabled = v.chunk === 0;
    if(back.disabled) back.style.opacity = 0.4;
    back.onclick = ()=>{ stopSpeech(); v.chunk--; render(); };
    const next = el("button","btn-main", v.chunk === total-1 ? "Questions →" : "Next →");
    next.onclick = ()=>{
      stopSpeech();
      if(v.chunk === total-1){ v.phase = "quiz"; v.q = 0; }
      else { v.chunk++; bump("pages"); }
      render(); window.scrollTo(0,0);
    };
    add(nav, back, next);
    add(f,nav);
    return f;
  }

  if(v.phase === "quiz"){
    const q = P.questions[v.q];
    const key = "p" + v.p + "q" + v.q;
    const rec = PROG.answers[key] || { correct:false, tries:0 };
    add(f, el("p","sub","Question " + (v.q+1) + " of " + P.questions.length));

    const c = el("section","card");
    const qrow = el("div","rowline");
    const qt = el("div","txt"); add(qt, el("p","chunk", q.q));
    add(qrow, qt, listenBtn(q.q));
    add(c,qrow);

    /* Shuffle the options, but keep the same order while the student is on
       this question, so the right answer is not always in the same place. */
    v.orders = v.orders || {};
    if(!v.orders[key]) v.orders[key] = q.opts.map((_,i)=>i).sort(()=>Math.random()-0.5);

    v.orders[key].forEach(i=>{
      const o = q.opts[i];
      const row = el("div","rowline");
      const b = el("button","opt", o);
      b.onclick = ()=>{
        rec.tries++;
        if(i === q.a){
          rec.correct = true;
          PROG.answers[key] = rec; bump("qa"); if(rec.tries === 1) bump("q1"); markToday(); save();
          showFeedback(c, true, q.why, ()=>{
            if(v.q === P.questions.length-1){
              PROG.passagesDone[v.p] = true;
              const t = U.tasks.find(t=>t.go[0]==="reading" && t.go[1]===v.p);
              if(t) completeTask(t.id);
              v.phase = "done";
            } else v.q++;
            save(); render(); window.scrollTo(0,0);
          });
        } else {
          PROG.answers[key] = rec; bump("qa"); save();
          showFeedback(c, false, "Almost. Listen to the question again, then try once more.", null);
        }
      };
      add(row, b, listenBtn(o));
      add(c,row);
    });
    add(f,c);
    return f;
  }

  /* done */
  const g = el("section","good prose");
  add(g, el("p",null,"You finished the whole passage. That is a win."));
  add(f,g);
  const row = el("div","btn-row");
  const other = el("button",null,"Read the other passage");
  other.onclick = ()=>{ VIEW.reading = { p:0, chunk:0, phase:"pick" }; render(); };
  const home = el("button","btn-main","Back to Today");
  home.onclick = ()=>go("today");
  add(row, home, other);
  add(f,row);
  return f;
}

function showFeedback(card, ok, msg, onNext){
  const old = card.querySelector(".fb"); if(old) old.remove();
  const box = el("div", (ok ? "good" : "note") + " fb");
  const row = el("div","rowline");
  const t = el("div","txt"); add(t, el("p",null, (ok ? "Yes. " : "") + msg));
  add(row, t, listenBtn(msg));
  add(box,row);
  if(ok && onNext){
    const b = el("button","btn-main","Next →");
    b.onclick = onNext;
    const br = el("div","btn-row"); add(br,b); add(box,br);
  }
  add(card, box);
  box.scrollIntoView({ block:"nearest" });
  if(!ok) say(msg);
}

/* ===================== WORD WORK ===================== */
let WS = null;
let WORD_MENU = false;

/* Open the spelling-set chooser (Set 1, Set 2, …). */
function openWordMenu(){
  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  WORD_MENU = true;
  S.section = "word";
  render(); window.scrollTo(0,0);
}

/* How many words in a set he has mastered, and whether the set is complete. */
function wordSetProgress(i){
  const words = U.wordSessions[i].words;
  const done = words.filter(w => S.wordsMastered[w.w]).length;
  return { done, total: words.length, complete: done === words.length };
}

function startWordSession(i){
  const sess = U.wordSessions[i] || U.wordSessions[0];
  WS = {
    si: i,
    queue: sess.words.map((w,ix)=>ix),   // spaced repetition: wrong words get pushed back
    pos: 0,
    stage: "hear",                        // hear -> look -> build -> type -> ok
    mode: "build",
    picked: [],
    tileOrder: null,                      // shuffled once per word, then fixed
    showHelp: false,                      // word shown again after a wrong try
    got: 0,
    total: sess.words.length
  };
}

/* The spelling-set chooser — one big card per set: Set 1, Set 2, … */
function viewWordMenu(){
  const f = document.createDocumentFragment();
  add(f, el("h1",null,"Word Work"));
  add(f, el("p","sub","Choose a spelling set."));
  U.wordSessions.forEach((s,i)=>{
    const pr = wordSetProgress(i);
    let status = "New";
    if(pr.complete) status = "✓ Done";
    else if(pr.done > 0) status = "Keep going — " + pr.done + " of " + pr.total + " words";

    const b = el("button","taskcard" + (pr.complete ? " done":""));
    const label = el("span");
    const l1 = el("div"); l1.style.fontWeight = "700";
    l1.textContent = "Set " + (i+1) + ": " + s.pattern;
    const l2 = el("div","sub"); l2.style.margin = "2px 0 0"; l2.textContent = status;
    add(label, l1, l2);
    add(b, el("span","ic","🔤"), label);
    if(pr.complete) add(b, el("span","tick","✓"));
    b.onclick = ()=>{ WORD_MENU = false; startWordSession(i); render(); window.scrollTo(0,0); };

    const row = el("div","rowline");
    add(row, b, listenBtn("Set " + (i+1) + ". " + s.say));
    add(f,row);
  });
  return f;
}

function viewWord(){
  if(WORD_MENU) return viewWordMenu();
  const f = document.createDocumentFragment();
  const sess = U.wordSessions[WS.si];

  add(f, el("h1",null,"Word Work"));
  add(f, el("p","sub", "Set " + (WS.si+1) + ": " + sess.pattern));

  if(WS.pos >= WS.queue.length){
    const g = el("section","good prose");
    add(g, el("p",null,"Session finished. You spelled " + WS.got + " words."));
    add(f,g);
    const t = U.tasks.find(t=>t.go[0]==="word" && t.go[1]===WS.si);
    if(t) completeTask(t.id);
    const row = el("div","btn-row");
    const home = el("button","btn-main","Back to Today"); home.onclick = ()=>go("today");
    const again = el("button",null,"Do it again"); again.onclick = ()=>{ startWordSession(WS.si); render(); };
    const more = el("button",null,"Choose another set"); more.onclick = ()=> openWordMenu();
    add(row, home, again, more); add(f,row);
    return f;
  }

  const W = sess.words[ WS.queue[WS.pos] ];
  const bar = el("div","bar"); const bi = el("i");
  bi.style.width = (WS.pos / WS.queue.length * 100) + "%"; add(bar,bi);
  add(f,bar);

  const c = el("section","card");

  /* STAGE 1 — hear it */
  if(WS.stage === "hear"){
    add(c, el("p","prose","Listen to the word. Then listen to the sentence."));
    const row = el("div","btn-row");
    add(row, listenBtn(W.w, "🔊 Hear the word"), listenBtn(W.sent, "🔊 Hear the sentence"));
    add(c,row);
    const b = el("button","btn-main","See the word →");
    b.onclick = ()=>{ WS.stage = "look"; render(); };
    const br = el("div","btn-row"); add(br,b); add(c,br);
    say(W.w);
    add(f,c); return f;
  }

  /* STAGE 2 — look at the chunks */
  if(WS.stage === "look"){
    add(c, el("p","word-big", W.w));
    const ch = el("p","chunks");
    ch.innerHTML = W.parts.map(p =>
      p.toLowerCase() === W.tricky ? '<span class="hi">'+p+'</span>' : p
    ).join(" – ");
    add(c,ch);
    add(c, el("p","prose","The tricky part is highlighted."));
    const row = el("div","btn-row");
    add(row, listenBtn(W.parts.join(", ") + ". " + W.w, "Hear the chunks"));
    const b = el("button","btn-main","Now you build it →");
    b.onclick = ()=>{ WS.stage = "build"; WS.picked = []; render(); };
    add(row,b);
    add(c,row);
    add(f,c); return f;
  }

  /* STAGE 3 — build from tiles (easier)
     This screen updates ITSELF in place. Tapping a chunk never re-draws the
     page, so the tiles cannot move, cannot lose their handlers, and cannot
     fail to appear in the slot. */
  if(WS.stage === "build"){
    add(c, el("h2",null,"Step 1 of 2: build the word"));
    add(c, el("p","prose","Tap the chunks in the right order."));
    const row0 = el("div","btn-row"); add(row0, listenBtn(W.w,"Hear it again")); add(c,row0);

    const slots = el("div","slots");
    add(c,slots);

    /* Shuffled once per word, then fixed. */
    if(!WS.tileOrder || WS.tileOrder.length !== W.parts.length){
      WS.tileOrder = W.parts.map((p,i)=>i).sort(()=> Math.random() - 0.5);
    }

    const tiles = el("div","tiles");
    const btns = {};                              /* part index -> button */
    const msg = el("div");                        /* inline feedback, no re-render */

    function paint(){
      slots.textContent = WS.picked.map(i=>W.parts[i]).join(" ");
      WS.tileOrder.forEach(i=>{
        btns[i].classList.toggle("used", WS.picked.indexOf(i) !== -1);
      });
    }
    function reset(){
      WS.picked = [];
      paint();
      tiles.querySelectorAll("button").forEach(t => t.disabled = false);
    }

    WS.tileOrder.forEach(i=>{
      const b = el("button","tile", W.parts[i]);
      b.type = "button";
      btns[i] = b;
      b.addEventListener("click", function(){
        if(WS.picked.indexOf(i) !== -1) return;   /* already used */
        WS.picked.push(i);
        paint();                                  /* the chunk appears NOW */
        clear(msg);

        if(WS.picked.length === W.parts.length){
          const built = WS.picked.map(x=>W.parts[x]).join("");
          if(same(built, W.w)){
            /* Say so, and let HER move on. The screen never jumps by itself. */
            const box = el("div","good");
            add(box, el("p",null,"Yes. You built the word " + W.w + "."));
            const nxt = el("button","btn-main","Next: type it from memory →");
            nxt.addEventListener("click", ()=>{
              WS.stage = "type"; WS.showHelp = false;
              render(); window.scrollTo(0,0);
            });
            const nr = el("div","btn-row"); add(nr, nxt); add(box, nr);
            add(msg, box);
            say("Yes. You built the word " + W.w + ".");
            tiles.querySelectorAll("button").forEach(t => t.disabled = true);
          } else {
            const box = el("div","note");
            add(box, el("p",null,"Not quite. Listen again and try once more."));
            add(msg, box);
            say("Not quite. Listen again and try once more.");
            reset();                              /* tiles come straight back */
          }
        }
      });
      add(tiles,b);
    });
    add(c, tiles, msg);

    const br = el("div","btn-row");
    const undo = el("button","small","Undo last");
    undo.addEventListener("click", ()=>{ WS.picked.pop(); paint(); clear(msg); });
    const startOver = el("button","small","Start this word again");
    startOver.addEventListener("click", ()=>{ reset(); clear(msg); });
    add(br, undo, startOver); add(c,br);

    paint();                                      /* draw the current state once */
    add(f,c); return f;
  }

  /* STAGE 4 — type it (stretch)
     A wrong try NEVER moves him to another screen. The word appears above the
     box with the tricky part highlighted, the box clears, and he tries again
     in the same place. No timers, no screen jumps. */
  if(WS.stage === "type"){
    add(c, el("h2",null,"Step 2 of 2: type the word"));
    add(c, el("p","prose","The chunks are hidden now. Listen, then type the whole word in the empty box."));
    const row0 = el("div","btn-row"); add(row0, listenBtn(W.w,"Hear it again"), listenBtn(W.sent,"Hear the sentence")); add(c,row0);

    /* Help panel: only appears after a wrong try, and then stays. */
    if(WS.showHelp){
      const help = el("div","note");
      add(help, el("p",null,"Almost. Here is the word. Look at the highlighted part, then type it again."));
      add(help, el("p","word-big", W.w));
      const ch = el("p","chunks");
      ch.innerHTML = W.parts.map(p =>
        p.toLowerCase() === W.tricky ? '<span class="hi">'+p+'</span>' : p
      ).join(" – ");
      add(help, ch);
      const hrow = el("div","btn-row");
      add(hrow, listenBtn(W.parts.join(", ") + ". " + W.w, "Hear the chunks"));
      const rebuild = el("button",null,"Build it with chunks again");
      rebuild.onclick = ()=>{ WS.stage = "build"; WS.picked = []; render(); };
      add(hrow, rebuild);
      add(help, hrow);
      add(c, help);
    }

    const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.placeholder = "Type the word here";
    inp.setAttribute("aria-label","Type the word");
    add(c,inp);
    const br = el("div","btn-row");
    const check = el("button","btn-main","Check my answer");
    check.onclick = ()=>{
      const got = inp.value;
      if(same(got, W.w)){
        if(!S.wordsMastered[W.w]) bump("words");
        S.wordsMastered[W.w] = true; WS.got++; WS.showHelp = false; markToday(); save();
        WS.stage = "ok"; render(); window.scrollTo(0,0);
      } else {
        /* Spaced repetition: bring this word back later in the session,
           but only queue it once, however many tries it takes. */
        if(!WS.showHelp) WS.queue.push(WS.queue[WS.pos]);
        WS.showHelp = true;
        say("Almost. Look at the word, then try once more.");
        render();                       /* stays on THIS screen */
        const again = document.querySelector("input[type=text]");
        if(again){ again.value = ""; again.focus(); }
      }
    };
    inp.addEventListener("keydown", e=>{ if(e.key === "Enter") check.click(); });
    add(br, check); add(c,br);
    add(f,c);
    setTimeout(()=>inp.focus(), 30);
    return f;
  }

  /* STAGE 5 — well done, next word */
  if(WS.stage === "ok"){
    const g = el("div","good"); add(g, el("p",null,"Yes. That is how you spell " + W.w + "."));
    add(c,g);
    const b = el("button","btn-main","Next word →");
    b.onclick = ()=>{ WS.pos++; WS.stage = "hear"; WS.picked = []; WS.tileOrder = null; WS.showHelp = false; render(); window.scrollTo(0,0); };
    const br = el("div","btn-row"); add(br,b); add(c,br);
    add(f,c); return f;
  }
  return f;
}

function viewVocab(){
  const f = document.createDocumentFragment();
  const v = VIEW.vocab || (VIEW.vocab = { mode:"learn", i:0, quizI:0, picked:null });
  add(f, el("h1",null,"Words"));

  });
  add(f,modes);

  if(v.mode === "learn"){
    const W = U.vocab[v.i];

    const c = el("section","card");
    add(c, el("p","sub","Card " + (v.i+1) + " of " + U.vocab.length));
    const e = el("p",null,W.emoji); e.style.cssText = "font-size:3.4em;margin:6px 0;line-height:1";

    const r1 = el("div","rowline");
    const t1 = el("div","txt"); add(t1, el("p","chunk", W.def));
    add(r1, t1, listenBtn(W.w + ". " + W.def));
    add(c,r1);
    const r2 = el("div","rowline");
    const t2 = el("div","txt"); add(t2, el("p","prose", W.sent));
    add(r2, t2, listenBtn(W.sent));
    add(c,r2);
    add(f,c);

    const nav = el("div","btn-row");
    const back = el("button",null,"← Back");
    back.disabled = v.i===0; if(back.disabled) back.style.opacity = 0.4;
    back.onclick = ()=>{ stopSpeech(); v.i--; render(); };
    const next = el("button","btn-main","Next word →");
    next.onclick = ()=>{
      stopSpeech();
      if(v.i === U.vocab.length-1){
        const t = U.tasks.find(t=>t.go[0]==="vocab");
        if(t) completeTask(t.id);
        v.mode = "quiz"; v.quizI = 0;
      } else v.i++;
      render(); window.scrollTo(0,0);
    };
    add(nav, back, next); add(f,nav);
    return f;

  /* quiz: word -> meaning, multiple choice */
  const W = U.vocab[v.quizI % U.vocab.length];
  const c = el("section","card");
  add(c, el("p","sub","Question " + (v.quizI+1) + " of " + U.vocab.length));
  const qrow = el("div","rowline");
  const qt = el("div","txt"); add(qt, el("p","chunk","What does '" + W.w + "' mean?"));
  add(qrow, qt, listenBtn("What does " + W.w + " mean?"));
  add(c,qrow);

  const wrongs = U.vocab.filter(x=>x.w !== W.w).sort(()=>Math.random()-0.5).slice(0,2);
  const opts = [W, ...wrongs].sort(()=>Math.random()-0.5);

  opts.forEach(o=>{
    const row = el("div","rowline");
    const b = el("button","opt", o.def);
    b.onclick = ()=>{
      if(o.w === W.w){
        PROG.vocabQuiz.right++; bump("va"); bump("vr"); markToday(); save();
        showFeedback(c, true, "'" + W.w + "' means " + W.def, ()=>{
          if(v.quizI === U.vocab.length-1){ v.mode="learn"; v.i=0; v.quizI=0; }
          else v.quizI++;
          render(); window.scrollTo(0,0);
        });
      } else {
        PROG.vocabQuiz.wrong++; bump("va"); save();
        showFeedback(c, false, "Almost. Listen to the word again and try once more.", null);
      }
    };
    add(row, b, listenBtn(o.def));
    add(c,row);
  });
  add(f,c);
  return f;
}

function startGrammarSet(i){

}
function grammarSetProgress(i){

}

function viewGrammarMenu(){

function viewGrammar(){
  if(GRAMMAR_MENU || !GG) return viewGrammarMenu();
  const f = document.createDocumentFragment();
  const set = U.grammar[GG.si];
  add(f, el("h1",null,"Grammar"));
  add(f, el("p","sub","Game " + (GG.si+1) + ": " + set.title));

  /* Intro card, shown once at the start of a game. */
  if(!GG.introSeen){
    const c = el("section","card prose");
    add(c, el("h2",null, set.skill));
    const r = el("div","rowline");
    const t = el("div","txt"); add(t, el("p","chunk", set.intro));
    add(r, t, listenBtn(set.intro));
    add(c,r);
    const br = el("div","btn-row");
    const go1 = el("button","btn-main","Start →");
    go1.onclick = ()=>{ GG.introSeen = true; render(); window.scrollTo(0,0); };
    add(br, go1); add(c,br);
    add(f,c);
    return f;
  }

  /* Finished the game. */
  if(GG.i >= set.items.length){
    if(!PROG.grammarDone[GG.si]){ PROG.grammarDone[GG.si] = true; markToday(); save(); }
    const g = el("section","good prose");
    add(g, el("p",null,"You finished this grammar game. Nice thinking."));
    add(f,g);
    const row = el("div","btn-row");
    const home = el("button","btn-main","Back to Today"); home.onclick = ()=>go("today");
    const more = el("button",null,"Choose another game"); more.onclick = ()=> openGrammarMenu();
    add(row, home, more); add(f,row);
    return f;
  }

  /* One tap-to-choose question. */
  const item = set.items[GG.i];
  const bar = el("div","bar"); const bi = el("i");
  bi.style.width = (GG.i / set.items.length * 100) + "%"; add(bar,bi);
  add(f,bar);
  add(f, el("p","sub","Question " + (GG.i+1) + " of " + set.items.length));

  const c = el("section","card");
  const qrow = el("div","rowline");
  const qt = el("div","txt"); add(qt, el("p","chunk", item.q));
  add(qrow, qt, listenBtn(item.q));
  add(c,qrow);

  /* Shuffle options once per question so the answer is not always first. */
  GG.order = GG.order || {};
  if(!GG.order[GG.i]) GG.order[GG.i] = item.opts.map((_,k)=>k).sort(()=>Math.random()-0.5);

  GG.order[GG.i].forEach(k=>{
    const o = item.opts[k];
    const row = el("div","rowline");
    const b = el("button","opt", o);
    b.onclick = ()=>{
      if(k === item.a){
        PROG.grammarQuiz.right++; bump("ga"); bump("gr"); markToday(); save();
        showFeedback(c, true, item.why, ()=>{ GG.i++; render(); window.scrollTo(0,0); });
      } else {
        PROG.grammarQuiz.wrong++; bump("ga"); save();
        showFeedback(c, false, "Almost. Listen to the question again and try once more.", null);
      }
    };
    add(row, b, listenBtn(o));
    add(c,row);
  });
  add(f,c);
  return f;
}

/* ===================== WRITING ===================== */
function viewWriting(){
  const f = document.createDocumentFragment();
  const Wr = U.writing;
  add(f, el("h1",null,"Writing"));
  add(f, el("p","sub", Wr.type + " — " + Wr.title));

  const intro = el("section","card prose");
  const ir = el("div","rowline");
  const it = el("div","txt"); add(it, el("p",null, Wr.classTask));
  add(ir, it, listenBtn(Wr.classTask));
  add(intro,ir);
  Wr.reminders.forEach(r=>{
    const row = el("div","rowline");
    const t = el("div","txt"); add(t, el("p",null,"• " + r));
    add(row, t, listenBtn(r));
    add(intro,row);
  });
  add(f,intro);

  /* Step A — first choice (fiction: the setting; non-fiction: the subject) */
  if(Wr.settings && Wr.settings.length){
  const c1 = el("section","card");
  add(c1, el("h2",null, Wr.settingsLabel || "Choose where your story happens"));
  Wr.settings.forEach(s=>{
    const row = el("div","rowline");
    const b = el("button","opt" + (PROG.writingSetting===s.text ? " picked":""), s.icon + "  " + s.text);
    b.onclick = ()=>{ PROG.writingSetting = s.text; markToday(); save(); render(); };
    add(row, b, listenBtn(s.text));
    add(c1,row);
  });
  add(f,c1);
  }

  /* Step B — second choice (fiction: the danger; non-fiction: the angle) */
  if(Wr.problems && Wr.problems.length){
  const c2 = el("section","card");
  add(c2, el("h2",null, Wr.problemsLabel || "Choose the danger"));
  Wr.problems.forEach(s=>{
    const row = el("div","rowline");
    const b = el("button","opt" + (PROG.writingProblem===s.text ? " picked":""), s.icon + "  " + s.text);
    b.onclick = ()=>{ PROG.writingProblem = s.text; markToday(); save(); render(); };
    add(row, b, listenBtn(s.text));
    add(c2,row);
  });
  add(f,c2);
  }

  /* Step C — tap-in-order sentence warm-up (no dragging) */
  if(Wr.order) add(f, orderGame(Wr.order));

  /* Step D — the four writing steps */
  Wr.steps.forEach(st=>{
    const c = el("section","card");
    add(c, el("h2",null, st.label));
    const hr = el("div","rowline");
    const ht = el("div","txt"); add(ht, el("p","sub", st.hint));
    add(hr, ht, listenBtn(st.hint));
    add(c,hr);

    /* A word bank for this step: speech verbs in fiction, connectives or
       question openers in non-fiction. */
    const bank = (st.key === "speak" ? (Wr.speechVerbs || []) : (st.tiles || []));
    if(bank.length){
      const bankLabel = st.key === "speak"
        ? "Strong words instead of 'said':"
        : (st.tilesLabel || "Words you could use:");
      add(c, el("p","sub", bankLabel));
      const tiles = el("div","tiles");
      bank.forEach(v=>{
        const b = el("button","small", v);
        b.onclick = ()=>{ say(v); insertAt(st.key, v); };
        add(tiles,b);
      });
      add(c,tiles);
    }

    const starters = el("div","tiles");
    st.starters.forEach(s=>{
      const b = el("button","small", s);
      b.title = "Tap to put this in your writing";
      b.onclick = ()=>{ insertAt(st.key, s + " "); say(s); };
      add(starters,b);
    });
    add(c, el("p","sub","Tap a starter to use it."), starters);

    const ta = el("textarea");
    ta.id = "w_" + st.key;
    ta.setAttribute("aria-label", st.label);
    ta.value = PROG.writing[st.key] || "";
    ta.oninput = ()=>{ PROG.writing[st.key] = ta.value; markToday(); save(); };
    add(c,ta);

    const row = el("div","btn-row");
    const b = el("button","btn-listen","🔊 Read my writing back");
    b.onclick = ()=>{ const t = (PROG.writing[st.key]||"").trim(); if(t){ speak(t); } else { say("You have not written anything here yet."); } };
    add(row,b);
    add(c,row);
    add(f,c);
  });

  /* Step E — self check */
  const c5 = el("section","card");
  add(c5, el("h2",null,"5. Check my writing"));
  Wr.checklist.forEach((item,i)=>{
    const row = el("div","rowline");
    const key = "chk"+i;
    const b = el("button","opt" + (PROG.writing[key] ? " picked":""), (PROG.writing[key] ? "✓  ":"○  ") + item);
    b.onclick = ()=>{ PROG.writing[key] = !PROG.writing[key]; save(); render(); };
    add(row, b, listenBtn(item));
    add(c5,row);
  });

  const row = el("div","btn-row");
  const piece = U.writing.piece || "story";
  const all = el("button","btn-listen","🔊 Read my whole " + piece);
  all.onclick = ()=>{ const t = fullStory(); if(t){ speak(t); } else { say("Your " + piece + " is empty so far."); } };
  const copy = el("button","btn-main","Copy my story");
  copy.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(fullStory()); copy.textContent = "Copied ✓"; }
    catch(e){ copy.textContent = "Select the text and copy it"; }
    setTimeout(()=>copy.textContent = "Copy my story", 2200);
  };
  add(row, all, copy);
  add(c5,row);
  add(f,c5);
  return f;
}

function fullStory(){
  return U.writing.steps.map(s=>(PROG.writing[s.key]||"").trim()).filter(Boolean).join("\n\n");
}
function insertAt(key, text){
  const ta = document.getElementById("w_" + key);
  if(!ta) return;
  const cur = ta.value;
  ta.value = cur + (cur && !cur.endsWith(" ") && !cur.endsWith("\n") ? " " : "") + text;
  PROG.writing[key] = ta.value; save();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

let ORDER_PICK = [];
function orderGame(O){
  const c = el("section","card");
  add(c, el("h2",null,"Warm-up: build a sentence"));
  const r = el("div","rowline");
  const t = el("div","txt"); add(t, el("p","sub", O.prompt));
  add(r, t, listenBtn(O.prompt));
  add(c,r);

  const slots = el("div","slots", ORDER_PICK.map(i=>O.words[i]).join(" "));
  slots.style.fontSize = "1.3em";
  add(c,slots);

  const tiles = el("div","tiles");
  O.words.forEach((w,i)=>{
    const b = el("button","tile", w);
    if(ORDER_PICK.includes(i)) b.classList.add("used");
    b.onclick = ()=>{
      if(ORDER_PICK.includes(i)){ ORDER_PICK = ORDER_PICK.filter(x=>x!==i); }  /* tap again to undo */
      else ORDER_PICK.push(i);
      if(ORDER_PICK.length === O.words.length){
        const built = ORDER_PICK.map(x=>O.words[x]).join(" ");
        setTimeout(()=>{
          if(built === O.answer){
            say("Yes. " + O.answer);
            PROG.writing.orderDone = true; markToday(); save();
          } else {
            say("Almost. Listen and try once more.");
          }
          render();
        }, 60);
      }
      render();
    };
    add(tiles,b);
  });
  add(c,tiles);
  if(PROG.writing.orderDone){
    const g = el("div","good"); add(g, el("p",null,"Yes: " + O.answer));
    add(c,g);
  }
  const reset = el("button","small","Start again");
  reset.onclick = ()=>{ ORDER_PICK = []; PROG.writing.orderDone = false; save(); render(); };
  const br = el("div","btn-row"); add(br,reset); add(c,br);
  return c;
}

/* ===================== YOU ARE THE HERO (adventure) =====================
   A choose-your-path story. Data lives in U.adventure (DATA BLOCK).
   No wrong choices, no bad endings — every ending is safe and positive,
   so replaying to find new endings is pure reward, never a penalty.
   The current page and endings found live in PROG.adventure (only goes up). */
let ADV_MENU = false;

function advTotalEndings(){
  if(!U.adventure) return 0;
  return Object.values(U.adventure.nodes).filter(n => n.ending).length;
}
function advFound(){ return Object.keys(PROG.adventure.endings).length; }

/* Open the story menu (shows a resume card if he is mid-story). */
function openAdventureMenu(){
  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  ADV_MENU = true;
  S.section = "adventure";
  save(); render(); window.scrollTo(0,0);
}

function advStart(){
  stopSpeech();
  ADV_MENU = false;
  PROG.adventure.node = U.adventure.start;
  save(); render(); window.scrollTo(0,0);
}

function advChoose(next){
  stopSpeech();
  PROG.adventure.node = next;
  const n = U.adventure.nodes[next];
  if(n && n.ending && !PROG.adventure.endings[next]){
    PROG.adventure.endings[next] = true;      /* a new ending — permanent win */
    bump("end"); markToday();
  }
  save(); render(); window.scrollTo(0,0);
}
