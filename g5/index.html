<style>
  /* ---------- Theme tokens (changed by the Settings panel) ---------- */
  :root{
    --bg:#FAF6EF;
    --panel:#FFFDF8;
    --ink:#2B2B2B;
    --muted:#5A5A5A;
    --line:#D8D2C6;
    --accent:#2E6B5E;         /* calm green */
    --accent-soft:#DDEBE6;
    --warm:#8A5A2B;
    --warm-soft:#F3E4D2;
    --focus:#1B5FA8;
    --fs:19px;                /* base font size, A- / A+ change this */
    --track:0em;              /* letter-spacing, dyslexia spacing toggle */
    --wordtrack:0em;          /* word-spacing */
    --font: Lexend, "Lexend Deca", Verdana, Tahoma, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:var(--fs);
    line-height:1.6;
    letter-spacing:var(--track);
    word-spacing:var(--wordtrack);
    text-align:left;
    padding-bottom:120px;
  }
  p,li,td,th,label,button,input,textarea,select{
    font-family:var(--font);
    letter-spacing:var(--track);
    word-spacing:var(--wordtrack);
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  .small{font-size:0.82em;min-height:40px;padding:6px 10px}

  nav{background:var(--panel);border-bottom:2px solid var(--line);position:sticky;top:69px;z-index:19}

  .card{

  .word-big{font-size:2.1em;font-weight:700;letter-spacing:0.04em;margin:8px 0}

  .bar > i{display:block;height:100%;background:var(--accent)}
  @media (prefers-reduced-motion: no-preference){
    .card, .good {transition:background 160ms ease}
  }
  @media (max-width:560px){
    nav button{min-width:74px;font-size:0.7em}

  }
</style>

function clone(o){ return JSON.parse(JSON.stringify(o)); }   /* works on every browser */

/* Compare a typed or built word with the target word, forgivingly:
   ignores capitals, ordinary spaces, non-breaking spaces from autocomplete,
   and stray punctuation. Only the letters have to be right. */
function same(a, b){
  const tidy = s => String(s == null ? "" : s)
    .normalize("NFC")
    .replace(/[ ​\s]/g, "")   /* nbsp, zero-width, any whitespace */
    .replace(/[^\p{L}'’-]/gu, "")       /* keep letters, apostrophes, hyphens */
    .replace(/[’]/g, "'")
    .toLowerCase();
  return tidy(a) === tidy(b) && tidy(a) !== "";
}

let S = load();

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return clone(defaultState);
    return Object.assign(clone(defaultState), JSON.parse(raw));
  }catch(e){ return clone(defaultState); }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function markToday(){
  const d = new Date().toISOString().slice(0,10);
  if(!S.daysPracticed.includes(d)){ S.daysPracticed.push(d); save(); }
}

/* Invisible usage diary — one row of counters per day, teacher view only.
   Keys: pages (pages turned), listens (Listen taps), words (newly mastered),
   qa/q1 (comprehension answers / right first try), va/vr (vocab answers/right),
   ga/gr (grammar answers/right), end (new story endings). No timers — counts only. */
function bump(key, n){
  const d = new Date().toISOString().slice(0,10);
  if(!S.log[d]) S.log[d] = {};
  S.log[d][key] = (S.log[d][key] || 0) + (n == null ? 1 : n);
  save();
}

/* ---------------- Speech ---------------- */
let VOICES = [], VOICE_OK = null;

function loadVoices(){
  VOICES = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || [];
  const en = VOICES.filter(v => (v.lang||"").toLowerCase().startsWith("en"));
  VOICE_OK = en.length > 0;
  return en;
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = () => { loadVoices(); if(S.section==="today") render(); };
}
/* Preferred voice, in order. Ava (Premium) is the one installed on her MacBook;
   if it is ever missing, fall back to the next best rather than the robot. */
const VOICE_WISHLIST = [/ava.*(premium|enhanced)/i, /ava/i, /(premium|enhanced)/i];

function pickVoice(en){
  if(S.settings.voice){
    const saved = en.find(v => v.name === S.settings.voice);
    if(saved) return saved;                       /* teacher's explicit choice wins */
  }
  for(const want of VOICE_WISHLIST){
    const hit = en.find(v => want.test(v.name));
    if(hit) return hit;
  }
  return en[0];
}

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  if(PLAYER){ PLAYER.pause(); PLAYER = null; }   /* never talk over a clip */
  const u = new SpeechSynthesisUtterance(text);
  u.rate = S.settings.rate;
  u.pitch = 1;
  const en = loadVoices();
  const chosen = pickVoice(en);
  if(chosen) u.voice = chosen;
  u.lang = chosen ? chosen.lang : "en-GB";
  speechSynthesis.speak(u);
}
let READALONG = false;
function stopSpeech(){
  READALONG = false;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(PLAYER){ PLAYER.pause(); PLAYER = null; }
}

let PLAYER = null;

function playClip(src){
  if(PLAYER){ PLAYER.pause(); PLAYER = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();   /* never talk over a clip */
  PLAYER = new Audio(src);
  PLAYER.playbackRate = S.settings.rate < 0.9 ? 0.9 : 1;
  PLAYER.play().catch(()=>{});   /* if the clip is missing, fall back quietly */
  return PLAYER;
}
function say(text){
  const clip = AUDIO[text];
  if(clip){
    const p = playClip(clip);
    p.onerror = ()=> speak(text);
    return;
  }
  speak(text);
}

/* Speak (or play a clip) and run a callback when it finishes.
   Used by read-along so the on-screen text keeps pace with the voice. */
function sayThen(text, done){
  const clip = AUDIO[text];
  if(clip){
    const p = playClip(clip);
    p.onended = ()=> done && done();
    p.onerror = ()=> speakThen(text, done);
    return;
  }
  speakThen(text, done);
}
function speakThen(text, done){
  if(!window.speechSynthesis){ done && done(); return; }
  speechSynthesis.cancel();
  if(PLAYER){ PLAYER.pause(); PLAYER = null; }   /* never talk over a clip */
  const u = new SpeechSynthesisUtterance(text);
  u.rate = S.settings.rate; u.pitch = 1;
  const en = loadVoices(); const chosen = pickVoice(en);
  if(chosen) u.voice = chosen;
  u.lang = chosen ? chosen.lang : "en-GB";
  u.onend = ()=> done && done();
  speechSynthesis.speak(u);
}

/* A Listen button, always the same shape, always in the same place. */
function listenBtn(text, label){
  const b = el("button","btn-listen");
  b.type = "button";
  b.innerHTML = "🔊 " + (label || "Listen");
  b.setAttribute("aria-label","Listen: " + text.slice(0,60));
  b.onclick = () => { bump("listens"); say(text); };
  return b;
}

/* ---------------- Tiny DOM helpers ---------------- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function add(parent, ...kids){ kids.forEach(k => k && parent.appendChild(k)); return parent; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

const BGS = { cream:"#FAF6EF", blue:"#EAF2F8", yellow:"#FBF3D5" };

function applySettings(){
  const r = document.documentElement.style;
  r.setProperty("--fs", S.settings.fs + "px");
  r.setProperty("--bg", BGS[S.settings.bg] || BGS.cream);
  r.setProperty("--track", S.settings.spacing ? "0.05em" : "0em");
  r.setProperty("--wordtrack", S.settings.spacing ? "0.15em" : "0em");
}

function settingsPanel(){
  const c = el("section","card");
  add(c, el("h2",null,"Settings"));

  const mk = (labelText, node) => {
    const w = el("div"); w.style.margin = "14px 0";
    const l = el("div",null,labelText); l.style.fontWeight = "700";
    add(w, l, node); return w;
  };

  const bgRow = el("div","btn-row");
  [["cream","Cream"],["blue","Pale blue"],["yellow","Pale yellow"]].forEach(([k,name])=>{
    const b = el("button",null,name);
    if(S.settings.bg===k) b.classList.add("btn-main");
    b.onclick = ()=>{ S.settings.bg=k; save(); applySettings(); render(); };
    add(bgRow,b);
  });

  const spaceBtn = el("button", null, S.settings.spacing ? "Wide spacing: ON" : "Wide spacing: OFF");
  if(S.settings.spacing) spaceBtn.classList.add("btn-main");
  spaceBtn.onclick = ()=>{ S.settings.spacing = !S.settings.spacing; save(); applySettings(); render(); };

  const rateRow = el("div","btn-row");
  [[0.7,"Slow"],[0.85,"Steady"],[1.0,"Normal"]].forEach(([v,name])=>{
    const b = el("button",null,name);
    if(Math.abs(S.settings.rate - v) < 0.01) b.classList.add("btn-main");
    b.onclick = ()=>{ S.settings.rate=v; save(); render(); speak("This is my reading speed."); };
    add(rateRow,b);
  });

  const en = loadVoices();
  let voiceNode;
  if(en.length){
    const sel = el("select");
    sel.style.cssText = "font-size:1em;padding:10px;border-radius:12px;border:2px solid var(--line);min-height:48px;max-width:100%";
    en.forEach(v=>{
      const o = el("option",null, v.name + " (" + v.lang + ")");
      o.value = v.name;
      if(v.name === S.settings.voice) o.selected = true;
      add(sel,o);
    });
    const auto = pickVoice(en);
    if(!S.settings.voice && auto) sel.value = auto.name;   /* show what is really being used */
    sel.onchange = ()=>{ S.settings.voice = sel.value; save(); speak("Hello. I will read for you."); };
    const row = el("div","rowline");
    add(row, sel, listenBtn("Hello. I will read for you.","Test"));
    voiceNode = el("div");
    add(voiceNode, row);
    add(voiceNode, el("p","sub", auto && /ava/i.test(auto.name)
      ? "Using Ava. Good."
      : "Ava was not found on this computer, so a different voice is being used. Install Ava (Premium) in System Settings \u2192 Accessibility \u2192 Read & Speak \u2192 System voice \u2192 \u24d8"));
  } else {
    voiceNode = el("p","sub","No English voice was found on this computer yet. See the note on the Today page.");
  }

  add(c,
    mk("Background colour", bgRow),
    mk("Letter and word spacing", spaceBtn),
    mk("Reading speed", rateRow),
    mk("Voice", voiceNode)
  );
  return c;
}

function go(section, idx){
  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  S.section = section;
  if(section==="reading"){
    /* Resume where she left off if she is coming back to the same passage;
       otherwise start the chosen passage fresh. */
    if(S.reading && (idx == null || S.reading.p === idx) && S.reading.phase !== "done"){
      VIEW.reading = S.reading;
    } else {
      VIEW.reading = { p: idx||0, chunk:0, phase:"read", q:0 };
    }
  }
  if(section==="word"){ WORD_MENU = false; startWordSession(idx||0); }
  if(section==="grammar"){ GRAMMAR_MENU = false; startGrammarSet(idx||0); }
  if(section==="vocab")   VIEW.vocab = { mode:"learn", i:0, quizI:0, picked:null };
  save(); render(); window.scrollTo(0,0);
}

  const all = U.tasks.every(t=>S.tasksDone[t.id]);
  if(all){
    const g = el("div","good");
    add(g, el("p","prose","All your tasks are done. Well done today."));

  }
  return f;

/* ===================== HUSKY PUP (Today companion) =====================
   A motivation layer, not an activity. The pup collects gear as her
   cumulative wins grow. Wins only ever go up, so the pup never loses
   anything and is never disappointed — only ever more pleased. */
const PUP_NAMES = ["Miko", "Luna", "Snowy", "Pancake"];
const PUP_GEAR = [
  [5,  "🧣", "a warm scarf"],
  [12, "🎒", "a little satchel"],
  [20, "🏮", "a lantern"],
  [30, "🗺️", "a map"],
  [45, "🧭", "a compass"],
  [60, "🎖️", "a hero medal"]
];

function pupScore(){
  return S.daysPracticed.length
       + Object.keys(S.passagesDone).length
       + Object.keys(S.wordsMastered).length
       + Object.keys(S.vocabSeen).length
       + Object.keys(S.grammarDone).length
       + Object.keys(S.adventure.endings).length;
}

function pupCard(){
  const c = el("section","card");

  /* first visit: she names the pup (tap, no typing) */
  if(!S.pup.name){
    add(c, el("h2",null,"🐶 A husky pup has joined you!"));
    const msg = "This little husky will keep you company while you read. What will you call your pup?";
    add(c, el("p","prose",msg));
    const row = el("div","btn-row");
    PUP_NAMES.forEach(n=>{
      const b = el("button",null,n);
      b.onclick = ()=>{ S.pup.name = n; save(); render(); };
      add(row,b);
    });
    add(c,row);
    const lr = el("div","btn-row");
    add(lr, listenBtn(msg + " " + PUP_NAMES.join(", or ") + "?"));
    add(c,lr);
    return c;
  }

  const name = S.pup.name;
  const sc = pupScore();
  const earned = PUP_GEAR.filter(g => sc >= g[0]);
  const next = PUP_GEAR.find(g => sc < g[0]);

  const top = el("div","rowline");
  const pup = el("span",null,"🐶");
  pup.style.fontSize = "52px";
  pup.setAttribute("aria-hidden","true");
  const label = el("span");
  const line1 = el("div"); line1.style.fontWeight = "700";
  line1.textContent = name + (earned.length ? "  " + earned.map(g=>g[1]).join(" ") : "");
  const line2 = el("div","sub"); line2.style.margin = "2px 0 0";
  line2.textContent = sc === 0
    ? name + " is ready when you are."
    : name + " is proud of you. You have " + sc + " win" + (sc===1?"":"s") + " together.";
  add(label, line1, line2);
  add(top, pup, label);
  add(c, top);

  let say2 = "";
  if(next){
    say2 = "Next up: " + next[2] + " for " + name + " at " + next[0] + " wins.";
    add(c, el("p","sub", next[1] + " " + say2));
  } else {
    say2 = name + " has every piece of gear. What a team.";
    add(c, el("p","sub","🎖️ " + say2));
  }
  const lr = el("div","btn-row");
  add(lr, listenBtn(line2.textContent + " " + say2));
  add(c,lr);
  return c;
}

/* Play the passage from the current chunk to the end, advancing the visible
   text as each chunk finishes so the page follows the voice. */
function startReadAlong(){
  const v = VIEW.reading;
  const P = U.passages[v.p];
  READALONG = true;
  render();
  const speakCurrent = ()=>{
    if(!READALONG) return;
    sayThen(P.chunks[v.chunk], ()=>{
      if(!READALONG) return;
      if(v.chunk < P.chunks.length - 1){
        v.chunk++; bump("pages");
        render();            /* turn the page, then keep reading */
        speakCurrent();
      } else {
        READALONG = false;
        render();            /* finished — show the normal buttons again */
      }
    });
  };
  speakCurrent();
}

/* Open the passage chooser (the menu of Passage 1, Passage 2, …). */

  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  S.section = "reading";
  VIEW.reading = { p: (VIEW.reading ? VIEW.reading.p : 0), chunk:0, phase:"pick", q:0 };
  render(); window.scrollTo(0,0);
}

/* ===================== READING ===================== */
function viewReading(){
  const f = document.createDocumentFragment();
  const v = VIEW.reading || (VIEW.reading = { p:0, chunk:0, phase:"pick", q:0 });
  const P = U.passages[v.p];

  /* passage picker — one big card per passage: Passage 1, Passage 2, … */
  if(v.phase === "pick"){
    add(f, el("h1",null,"Reading"));
    add(f, el("p","sub","Choose a passage."));
    U.passages.forEach((p,i)=>{
      const done = !!S.passagesDone[i];
      const here = S.reading && S.reading.p === i && S.reading.phase === "read" && S.reading.chunk > 0;

      let status = "New";
      if(done) status = "✓ Done";
      else if(here) status = "Keep going — page " + (S.reading.chunk+1);

      const b = el("button","taskcard" + (done ? " done":""));
      const label = el("span");
      const line1 = el("div"); line1.style.fontWeight = "700";
      line1.textContent = "Passage " + (i+1) + ": " + p.title;
      const line2 = el("div","sub"); line2.style.margin = "2px 0 0";
      line2.textContent = status;
      add(label, line1, line2);
      add(b, el("span","ic","📖"), label);
      if(done) add(b, el("span","tick","✓"));

      b.onclick = ()=> go("reading", i);   /* resumes this passage if in progress */

      const row = el("div","rowline");
      add(row, b, listenBtn("Passage " + (i+1) + ". " + p.title + ". " + p.blurb));
      add(f,row);
    });
    return f;
  }

  add(f, el("h1",null,P.title));

  if(v.phase === "read"){
    const total = P.chunks.length;
    add(f, el("p","sub","Page " + (v.chunk+1) + " of " + total));
    const bar = el("div","bar"); const i = el("i"); i.style.width = ((v.chunk+1)/total*100)+"%"; add(bar,i);
    add(f,bar);

    const c = el("section","card prose");
    add(c, el("p","chunk", P.chunks[v.chunk]));
    const row = el("div","btn-row");
    add(row, listenBtn(P.chunks[v.chunk], "Listen to Page"));

    /* Plays from here to the end, turning the pages with the voice
       so the words on screen always match what she hears. */
    const along = el("button","btn-listen", READALONG ? "⏸ Stop" : "🔊 Listen to Whole Passage");
    along.type = "button";
    along.onclick = ()=>{
      if(READALONG){ stopSpeech(); render(); return; }
      startReadAlong();
    };
    add(row, along);
    add(c,row);
    add(f,c);

    const nav = el("div","btn-row");
    const back = el("button",null,"← Back");
    back.disabled = v.chunk === 0;
    if(back.disabled) back.style.opacity = 0.4;
    back.onclick = ()=>{ stopSpeech(); v.chunk--; render(); };
    const next = el("button","btn-main", v.chunk === total-1 ? "Questions →" : "Next →");
    next.onclick = ()=>{
      stopSpeech();
      if(v.chunk === total-1){ v.phase = "quiz"; v.q = 0; }
      else { v.chunk++; bump("pages"); }
      render(); window.scrollTo(0,0);
    };
    add(nav, back, next);
    add(f,nav);
    return f;
  }

  if(v.phase === "quiz"){
    const q = P.questions[v.q];
    const key = "p" + v.p + "q" + v.q;
    const rec = S.answers[key] || { correct:false, tries:0 };
    add(f, el("p","sub","Question " + (v.q+1) + " of " + P.questions.length));

    const c = el("section","card");
    const qrow = el("div","rowline");
    const qt = el("div","txt"); add(qt, el("p","chunk", q.q));
    add(qrow, qt, listenBtn(q.q));
    add(c,qrow);

    /* Shuffle the options, but keep the same order while the student is on
       this question, so the right answer is not always in the same place. */
    v.orders = v.orders || {};
    if(!v.orders[key]) v.orders[key] = q.opts.map((_,i)=>i).sort(()=>Math.random()-0.5);

    v.orders[key].forEach(i=>{
      const o = q.opts[i];
      const row = el("div","rowline");
      const b = el("button","opt", o);
      b.onclick = ()=>{
        rec.tries++;
        if(i === q.a){
          rec.correct = true;
          S.answers[key] = rec; bump("qa"); if(rec.tries === 1) bump("q1"); markToday(); save();
          showFeedback(c, true, q.why, ()=>{
            if(v.q === P.questions.length-1){
              S.passagesDone[v.p] = true;
              const t = U.tasks.find(t=>t.go[0]==="reading" && t.go[1]===v.p);
              if(t) completeTask(t.id);
              v.phase = "done";
            } else v.q++;
            save(); render(); window.scrollTo(0,0);
          });
        } else {
          S.answers[key] = rec; bump("qa"); save();
          showFeedback(c, false, "Almost. Listen to the question again, then try once more.", null);
        }
      };
      add(row, b, listenBtn(o));
      add(c,row);
    });
    add(f,c);
    return f;
  }

  /* done */
  const g = el("section","good prose");
  add(g, el("p",null,"You finished the whole passage. That is a win."));
  add(f,g);
  const row = el("div","btn-row");
  const other = el("button",null,"Read the other passage");
  other.onclick = ()=>{ VIEW.reading = { p:0, chunk:0, phase:"pick" }; render(); };
  const home = el("button","btn-main","Back to Today");
  home.onclick = ()=>go("today");
  add(row, home, other);
  add(f,row);
  return f;
}

function showFeedback(card, ok, msg, onNext){
  const old = card.querySelector(".fb"); if(old) old.remove();
  const box = el("div", (ok ? "good" : "note") + " fb");
  const row = el("div","rowline");
  const t = el("div","txt"); add(t, el("p",null, (ok ? "Yes. " : "") + msg));
  add(row, t, listenBtn(msg));
  add(box,row);
  if(ok && onNext){
    const b = el("button","btn-main","Next →");
    b.onclick = onNext;
    const br = el("div","btn-row"); add(br,b); add(box,br);
  }
  add(card, box);
  box.scrollIntoView({ block:"nearest" });
  if(!ok) say(msg);
}

/* ===================== WORD WORK ===================== */
let WS = null;
let WORD_MENU = false;

/* Open the spelling-set chooser (Set 1, Set 2, …). */
function openWordMenu(){
  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  WORD_MENU = true;
  S.section = "word";
  render(); window.scrollTo(0,0);
}

/* How many words in a set she has mastered, and whether the set is complete. */
function wordSetProgress(i){
  const words = U.wordSessions[i].words;
  const done = words.filter(w => S.wordsMastered[w.w]).length;
  return { done, total: words.length, complete: done === words.length };
}

function startWordSession(i){
  const sess = U.wordSessions[i] || U.wordSessions[0];
  WS = {
    si: i,
    queue: sess.words.map((w,ix)=>ix),   // spaced repetition: wrong words get pushed back
    pos: 0,
    stage: "hear",                        // hear -> look -> build -> type -> ok
    mode: "build",
    picked: [],
    tileOrder: null,                      // shuffled once per word, then fixed
    showHelp: false,                      // word shown again after a wrong try
    got: 0,
    total: sess.words.length
  };
}

/* The spelling-set chooser — one big card per set: Set 1, Set 2, … */
function viewWordMenu(){
  const f = document.createDocumentFragment();
  add(f, el("h1",null,"Word Work"));
  add(f, el("p","sub","Choose a spelling set."));
  U.wordSessions.forEach((s,i)=>{
    const pr = wordSetProgress(i);
    let status = "New";
    if(pr.complete) status = "✓ Done";
    else if(pr.done > 0) status = "Keep going — " + pr.done + " of " + pr.total + " words";

    const b = el("button","taskcard" + (pr.complete ? " done":""));
    const label = el("span");
    const l1 = el("div"); l1.style.fontWeight = "700";
    l1.textContent = "Set " + (i+1) + ": " + s.pattern;
    const l2 = el("div","sub"); l2.style.margin = "2px 0 0"; l2.textContent = status;
    add(label, l1, l2);
    add(b, el("span","ic","🔤"), label);
    if(pr.complete) add(b, el("span","tick","✓"));
    b.onclick = ()=>{ WORD_MENU = false; startWordSession(i); render(); window.scrollTo(0,0); };

    const row = el("div","rowline");
    add(row, b, listenBtn("Set " + (i+1) + ". " + s.say));
    add(f,row);
  });
  return f;
}

function viewWord(){
  if(WORD_MENU) return viewWordMenu();
  const f = document.createDocumentFragment();
  const sess = U.wordSessions[WS.si];

  add(f, el("h1",null,"Word Work"));
  add(f, el("p","sub", "Set " + (WS.si+1) + ": " + sess.pattern));

  if(WS.pos >= WS.queue.length){
    const g = el("section","good prose");
    add(g, el("p",null,"Session finished. You spelled " + WS.got + " words."));
    add(f,g);
    const t = U.tasks.find(t=>t.go[0]==="word" && t.go[1]===WS.si);
    if(t) completeTask(t.id);
    const row = el("div","btn-row");
    const home = el("button","btn-main","Back to Today"); home.onclick = ()=>go("today");
    const again = el("button",null,"Do it again"); again.onclick = ()=>{ startWordSession(WS.si); render(); };
    const more = el("button",null,"Choose another set"); more.onclick = ()=> openWordMenu();
    add(row, home, again, more); add(f,row);
    return f;
  }

  const W = sess.words[ WS.queue[WS.pos] ];
  const bar = el("div","bar"); const bi = el("i");
  bi.style.width = (WS.pos / WS.queue.length * 100) + "%"; add(bar,bi);
  add(f,bar);

  const c = el("section","card");

  /* STAGE 1 — hear it */
  if(WS.stage === "hear"){
    add(c, el("p","prose","Listen to the word. Then listen to the sentence."));
    const row = el("div","btn-row");
    add(row, listenBtn(W.w, "🔊 Hear the word"), listenBtn(W.sent, "🔊 Hear the sentence"));
    add(c,row);
    const b = el("button","btn-main","See the word →");
    b.onclick = ()=>{ WS.stage = "look"; render(); };
    const br = el("div","btn-row"); add(br,b); add(c,br);
    say(W.w);
    add(f,c); return f;
  }

  /* STAGE 2 — look at the chunks */
  if(WS.stage === "look"){
    add(c, el("p","word-big", W.w));
    const ch = el("p","chunks");
    ch.innerHTML = W.parts.map(p =>
      p.toLowerCase() === W.tricky ? '<span class="hi">'+p+'</span>' : p
    ).join(" – ");
    add(c,ch);
    add(c, el("p","prose","The tricky part is highlighted."));
    const row = el("div","btn-row");
    add(row, listenBtn(W.parts.join(", ") + ". " + W.w, "Hear the chunks"));
    const b = el("button","btn-main","Now you build it →");
    b.onclick = ()=>{ WS.stage = "build"; WS.picked = []; render(); };
    add(row,b);
    add(c,row);
    add(f,c); return f;
  }

  /* STAGE 3 — build from tiles (easier)
     This screen updates ITSELF in place. Tapping a chunk never re-draws the
     page, so the tiles cannot move, cannot lose their handlers, and cannot
     fail to appear in the slot. */
  if(WS.stage === "build"){
    add(c, el("h2",null,"Step 1 of 2: build the word"));
    add(c, el("p","prose","Tap the chunks in the right order."));
    const row0 = el("div","btn-row"); add(row0, listenBtn(W.w,"Hear it again")); add(c,row0);

    const slots = el("div","slots");
    add(c,slots);

    /* Shuffled once per word, then fixed. */
    if(!WS.tileOrder || WS.tileOrder.length !== W.parts.length){
      WS.tileOrder = W.parts.map((p,i)=>i).sort(()=> Math.random() - 0.5);
    }

    const tiles = el("div","tiles");
    const btns = {};                              /* part index -> button */
    const msg = el("div");                        /* inline feedback, no re-render */

    function paint(){
      slots.textContent = WS.picked.map(i=>W.parts[i]).join(" ");
      WS.tileOrder.forEach(i=>{
        btns[i].classList.toggle("used", WS.picked.indexOf(i) !== -1);
      });
    }
    function reset(){
      WS.picked = [];
      paint();
      tiles.querySelectorAll("button").forEach(t => t.disabled = false);
    }

    WS.tileOrder.forEach(i=>{
      const b = el("button","tile", W.parts[i]);
      b.type = "button";
      btns[i] = b;
      b.addEventListener("click", function(){
        if(WS.picked.indexOf(i) !== -1) return;   /* already used */
        WS.picked.push(i);
        paint();                                  /* the chunk appears NOW */
        clear(msg);

        if(WS.picked.length === W.parts.length){
          const built = WS.picked.map(x=>W.parts[x]).join("");
          if(same(built, W.w)){
            /* Say so, and let HER move on. The screen never jumps by itself. */
            const box = el("div","good");
            add(box, el("p",null,"Yes. You built the word " + W.w + "."));
            const nxt = el("button","btn-main","Next: type it from memory →");
            nxt.addEventListener("click", ()=>{
              WS.stage = "type"; WS.showHelp = false;
              render(); window.scrollTo(0,0);
            });
            const nr = el("div","btn-row"); add(nr, nxt); add(box, nr);
            add(msg, box);
            say("Yes. You built the word " + W.w + ".");
            tiles.querySelectorAll("button").forEach(t => t.disabled = true);
          } else {
            const box = el("div","note");
            add(box, el("p",null,"Not quite. Listen again and try once more."));
            add(msg, box);
            say("Not quite. Listen again and try once more.");
            reset();                              /* tiles come straight back */
          }
        }
      });
      add(tiles,b);
    });
    add(c, tiles, msg);

    const br = el("div","btn-row");
    const undo = el("button","small","Undo last");
    undo.addEventListener("click", ()=>{ WS.picked.pop(); paint(); clear(msg); });
    const startOver = el("button","small","Start this word again");
    startOver.addEventListener("click", ()=>{ reset(); clear(msg); });
    add(br, undo, startOver); add(c,br);

    paint();                                      /* draw the current state once */
    add(f,c); return f;
  }

  /* STAGE 4 — type it (stretch)
     A wrong try NEVER moves her to another screen. The word appears above the
     box with the tricky part highlighted, the box clears, and she tries again
     in the same place. No timers, no screen jumps. */
  if(WS.stage === "type"){
    add(c, el("h2",null,"Step 2 of 2: type the word"));
    add(c, el("p","prose","The chunks are hidden now. Listen, then type the whole word in the empty box."));
    const row0 = el("div","btn-row"); add(row0, listenBtn(W.w,"Hear it again"), listenBtn(W.sent,"Hear the sentence")); add(c,row0);

    /* Help panel: only appears after a wrong try, and then stays. */
    if(WS.showHelp){
      const help = el("div","note");
      add(help, el("p",null,"Almost. Here is the word. Look at the highlighted part, then type it again."));
      add(help, el("p","word-big", W.w));
      const ch = el("p","chunks");
      ch.innerHTML = W.parts.map(p =>
        p.toLowerCase() === W.tricky ? '<span class="hi">'+p+'</span>' : p
      ).join(" – ");
      add(help, ch);
      const hrow = el("div","btn-row");
      add(hrow, listenBtn(W.parts.join(", ") + ". " + W.w, "Hear the chunks"));
      const rebuild = el("button",null,"Build it with chunks again");
      rebuild.onclick = ()=>{ WS.stage = "build"; WS.picked = []; render(); };
      add(hrow, rebuild);
      add(help, hrow);
      add(c, help);
    }

    const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.placeholder = "Type the word here";
    inp.setAttribute("aria-label","Type the word");
    add(c,inp);
    const br = el("div","btn-row");
    const check = el("button","btn-main","Check my answer");
    check.onclick = ()=>{
      const got = inp.value;
      if(same(got, W.w)){
        if(!S.wordsMastered[W.w]) bump("words");
        S.wordsMastered[W.w] = true; WS.got++; WS.showHelp = false; markToday(); save();
        WS.stage = "ok"; render(); window.scrollTo(0,0);
      } else {
        /* Spaced repetition: bring this word back later in the session,
           but only queue it once, however many tries it takes. */
        if(!WS.showHelp) WS.queue.push(WS.queue[WS.pos]);
        WS.showHelp = true;
        say("Almost. Look at the word, then try once more.");
        render();                       /* stays on THIS screen */
        const again = document.querySelector("input[type=text]");
        if(again){ again.value = ""; again.focus(); }
      }
    };
    inp.addEventListener("keydown", e=>{ if(e.key === "Enter") check.click(); });
    add(br, check); add(c,br);
    add(f,c);
    setTimeout(()=>inp.focus(), 30);
    return f;
  }

  /* STAGE 5 — well done, next word */
  if(WS.stage === "ok"){
    const g = el("div","good"); add(g, el("p",null,"Yes. That is how you spell " + W.w + "."));
    add(c,g);
    const b = el("button","btn-main","Next word →");
    b.onclick = ()=>{ WS.pos++; WS.stage = "hear"; WS.picked = []; WS.tileOrder = null; WS.showHelp = false; render(); window.scrollTo(0,0); };
    const br = el("div","btn-row"); add(br,b); add(c,br);
    add(f,c); return f;
  }
  return f;
}

    back.onclick = ()=>{ stopSpeech(); v.i--; render(); };
    const next = el("button","btn-main","Next word →");

      stopSpeech();
      if(v.i === U.vocab.length-1){

  const wrongs = U.vocab.filter(x=>x.w !== W.w).sort(()=>Math.random()-0.5).slice(0,2);
  const opts = [W, ...wrongs].sort(()=>Math.random()-0.5);

  opts.forEach(o=>{
    const row = el("div","rowline");
    const b = el("button","opt", o.def);
    b.onclick = ()=>{
      if(o.w === W.w){
        S.vocabQuiz.right++; bump("va"); bump("vr"); markToday(); save();
        showFeedback(c, true, "'" + W.w + "' means " + W.def, ()=>{
          if(v.quizI === U.vocab.length-1){ v.mode="learn"; v.i=0; v.quizI=0; }
          else v.quizI++;
          render(); window.scrollTo(0,0);
        });
      } else {
        S.vocabQuiz.wrong++; bump("va"); save();
        showFeedback(c, false, "Almost. Listen to the word again and try once more.", null);
      }
    };
    add(row, b, listenBtn(o.def));
    add(c,row);
  });
  add(f,c);
  return f;
}

let GG = null;              // { si, i, introSeen }
let GRAMMAR_MENU = false;

function openGrammarMenu(){

  SHOW_SETTINGS = false; SHOW_TEACHER = false;

function startGrammarSet(i){

}

function viewGrammar(){

  const f = document.createDocumentFragment();

  add(f, el("h1",null,"Grammar"));
  add(f, el("p","sub","Game " + (GG.si+1) + ": " + set.title));

    add(c,r);
    const br = el("div","btn-row");

    add(f,c);
    return f;

  /* Finished the game. */
  if(GG.i >= set.items.length){

    const g = el("section","good prose");
    add(g, el("p",null,"You finished this grammar game. Nice thinking."));

    const row = el("div","btn-row");
    const home = el("button","btn-main","Back to Today"); home.onclick = ()=>go("today");

  /* One tap-to-choose question. */
  const item = set.items[GG.i];
  const bar = el("div","bar"); const bi = el("i");
  bi.style.width = (GG.i / set.items.length * 100) + "%"; add(bar,bi);

  /* Shuffle options once per question so the answer is not always first. */
  GG.order = GG.order || {};
  if(!GG.order[GG.i]) GG.order[GG.i] = item.opts.map((_,k)=>k).sort(()=>Math.random()-0.5);

  GG.order[GG.i].forEach(k=>{

    const row = el("div","rowline");

    b.onclick = ()=>{
      if(k === item.a){
        S.grammarQuiz.right++; bump("ga"); bump("gr"); markToday(); save();
        showFeedback(c, true, item.why, ()=>{ GG.i++; render(); window.scrollTo(0,0); });

    add(row, b, listenBtn(o));
    add(c,row);
  });
  add(f,c);
  return f;
}

    const row = el("div","rowline");
    const t = el("div","txt"); add(t, el("p",null,"• " + r));
    add(row, t, listenBtn(r));
    add(intro,row);
  });
  add(f,intro);

  /* Step A — choose a setting */
  const c1 = el("section","card");
  add(c1, el("h2",null,"Choose where your story happens"));
  Wr.settings.forEach(s=>{
    const row = el("div","rowline");
    const b = el("button","opt" + (S.writingSetting===s.text ? " picked":""), s.icon + "  " + s.text);
    b.onclick = ()=>{ S.writingSetting = s.text; markToday(); save(); render(); };
    add(row, b, listenBtn(s.text));
    add(c1,row);
  });
  add(f,c1);

  /* Step B — choose a problem */
  const c2 = el("section","card");
  add(c2, el("h2",null,"Choose the danger"));
  Wr.problems.forEach(s=>{
    const row = el("div","rowline");
    const b = el("button","opt" + (S.writingProblem===s.text ? " picked":""), s.icon + "  " + s.text);
    b.onclick = ()=>{ S.writingProblem = s.text; markToday(); save(); render(); };
    add(row, b, listenBtn(s.text));
    add(c2,row);
  });
  add(f,c2);

  /* Step C — tap-in-order sentence warm-up (no dragging) */
  add(f, orderGame(Wr.order));

  /* Step D — the four writing steps */
  Wr.steps.forEach(st=>{
    const c = el("section","card");
    add(c, el("h2",null, st.label));
    const hr = el("div","rowline");
    const ht = el("div","txt"); add(ht, el("p","sub", st.hint));
    add(hr, ht, listenBtn(st.hint));
    add(c,hr);

    if(st.key === "speak"){
      const p = el("p","sub","Strong words instead of 'said':");
      add(c,p);
      const tiles = el("div","tiles");
      Wr.speechVerbs.forEach(v=>{
        const b = el("button","small", v);
        b.onclick = ()=>{ say(v); insertAt(st.key, v); };
        add(tiles,b);
      });
      add(c,tiles);
    }

    const starters = el("div","tiles");
    st.starters.forEach(s=>{
      const b = el("button","small", s);
      b.title = "Tap to put this in your writing";
      b.onclick = ()=>{ insertAt(st.key, s + " "); say(s); };
      add(starters,b);
    });
    add(c, el("p","sub","Tap a starter to use it."), starters);

    const ta = el("textarea");
    ta.id = "w_" + st.key;
    ta.setAttribute("aria-label", st.label);
    ta.value = S.writing[st.key] || "";
    ta.oninput = ()=>{ S.writing[st.key] = ta.value; markToday(); save(); };
    add(c,ta);

    const row = el("div","btn-row");
    const b = el("button","btn-listen","🔊 Read my writing back");
    b.onclick = ()=>{ const t = (S.writing[st.key]||"").trim(); say(t ? t : "You have not written anything here yet."); };
    add(row,b);
    add(c,row);
    add(f,c);
  });

  /* Step E — self check */
  const c5 = el("section","card");
  add(c5, el("h2",null,"5. Check my writing"));
  Wr.checklist.forEach((item,i)=>{
    const row = el("div","rowline");
    const key = "chk"+i;
    const b = el("button","opt" + (S.writing[key] ? " picked":""), (S.writing[key] ? "✓  ":"○  ") + item);
    b.onclick = ()=>{ S.writing[key] = !S.writing[key]; save(); render(); };
    add(row, b, listenBtn(item));
    add(c5,row);
  });

  const row = el("div","btn-row");
  const all = el("button","btn-listen","🔊 Read my whole story");
  all.onclick = ()=> say(fullStory() || "Your story is empty so far.");
  const copy = el("button","btn-main","Copy my story");
  copy.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(fullStory()); copy.textContent = "Copied ✓"; }
    catch(e){ copy.textContent = "Select the text and copy it"; }
    setTimeout(()=>copy.textContent = "Copy my story", 2200);
  };
  add(row, all, copy);
  add(c5,row);
  add(f,c5);
  return f;
}

function fullStory(){
  return U.writing.steps.map(s=>(S.writing[s.key]||"").trim()).filter(Boolean).join("\n\n");
}
function insertAt(key, text){
  const ta = document.getElementById("w_" + key);
  if(!ta) return;
  const cur = ta.value;
  ta.value = cur + (cur && !cur.endsWith(" ") && !cur.endsWith("\n") ? " " : "") + text;
  S.writing[key] = ta.value; save();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

let ORDER_PICK = [];
function orderGame(O){
  const c = el("section","card");
  add(c, el("h2",null,"Warm-up: build a sentence"));
  const r = el("div","rowline");
  const t = el("div","txt"); add(t, el("p","sub", O.prompt));
  add(r, t, listenBtn(O.prompt));
  add(c,r);

  const slots = el("div","slots", ORDER_PICK.map(i=>O.words[i]).join(" "));
  slots.style.fontSize = "1.3em";
  add(c,slots);

  const tiles = el("div","tiles");
  O.words.forEach((w,i)=>{
    const b = el("button","tile", w);
    if(ORDER_PICK.includes(i)) b.classList.add("used");
    b.onclick = ()=>{
      if(ORDER_PICK.includes(i)){ ORDER_PICK = ORDER_PICK.filter(x=>x!==i); }  /* tap again to undo */
      else ORDER_PICK.push(i);
      if(ORDER_PICK.length === O.words.length){
        const built = ORDER_PICK.map(x=>O.words[x]).join(" ");
        setTimeout(()=>{
          if(built === O.answer){
            say("Yes. " + O.answer);
            S.writing.orderDone = true; markToday(); save();
          } else {
            say("Almost. Listen and try once more.");
          }
          render();
        }, 60);
      }
      render();
    };
    add(tiles,b);
  });
  add(c,tiles);
  if(S.writing.orderDone){
    const g = el("div","good"); add(g, el("p",null,"Yes: " + O.answer));
    add(c,g);
  }
  const reset = el("button","small","Start again");
  reset.onclick = ()=>{ ORDER_PICK = []; S.writing.orderDone = false; save(); render(); };
  const br = el("div","btn-row"); add(br,reset); add(c,br);
  return c;
}

/* ===================== YOU ARE THE HERO (adventure) =====================
   A choose-your-path story. Data lives in U.adventure (DATA BLOCK).
   No wrong choices, no bad endings — every ending is safe and positive,
   so replaying to find new endings is pure reward, never a penalty.
   The current page and endings found live in S.adventure (only goes up). */
let ADV_MENU = false;

function advTotalEndings(){
  if(!U.adventure) return 0;
  return Object.values(U.adventure.nodes).filter(n => n.ending).length;
}
function advFound(){ return Object.keys(S.adventure.endings).length; }

/* Open the story menu (shows a resume card if she is mid-story). */
function openAdventureMenu(){
  stopSpeech();
  SHOW_SETTINGS = false; SHOW_TEACHER = false;
  ADV_MENU = true;
  S.section = "adventure";
  save(); render(); window.scrollTo(0,0);
}

function advStart(){
  stopSpeech();
  ADV_MENU = false;
  S.adventure.node = U.adventure.start;
  save(); render(); window.scrollTo(0,0);
}

function advChoose(next){
  stopSpeech();
  S.adventure.node = next;
  const n = U.adventure.nodes[next];
  if(n && n.ending && !S.adventure.endings[next]){
    S.adventure.endings[next] = true;      /* a new ending — permanent win */
    bump("end"); markToday();
  }
  save(); render(); window.scrollTo(0,0);
}

function viewAdventure(){
  const f = document.createDocumentFragment();

    add(ir, listenBtn(A.intro));

    const bw = el("div");
    Object.keys(A.nodes).forEach(k=>{
      const n = A.nodes[k];

      const on = !!S.adventure.endings[k];
      const b = el("div","badge " + (on ? "on":"off"));
      add(b, el("span","ic", on ? n.icon : "❓"), el("span",null, on ? n.ending : "Not found yet"));
      add(bw,b);
    });
    add(f,bw);
    return f;
  }

  /* ---- story page ---- */
  add(f, el("h1",null,A.title));

  const c = el("section","card");
  add(c, el("p","prose",N.text));
  const lr = el("div","btn-row");
  add(lr, listenBtn(N.text, "Listen to this page"));
  add(c, lr);
  add(f, c);

  if(N.ending){
    const g = el("div","good");
    const line = "You found an ending: " + N.ending + "!";
    add(g, el("p","prose", (N.icon || "⭐") + " " + line));
    add(g, el("p","prose","That is " + advFound() + " of " + advTotalEndings() + " endings. Every ending you find stays yours."));
    const gr = el("div","btn-row");
    add(gr, listenBtn(line + " Well done. You kept your hero safe."));
    add(g, gr);
    add(f, g);

    const row = el("div","btn-row");

    again.onclick = advStart;
    const menu = el("button",null,"See all endings");

    const home = el("button",null,"Back to Today");
    home.onclick = ()=>go("today");
    add(row, again, menu, home);
    add(f, row);
    return f;
  }

  add(f, el("h2",null,"What do you do?"));
  N.choices.forEach(ch=>{
    const b = el("button","taskcard");
    add(b, el("span","ic",ch.icon), el("span",null,ch.label));
    b.onclick = ()=> advChoose(ch.next);

/* ===================== EVIDENCE FOR THE WRITING BANDS =====================
   This gathers FACTS ONLY. It does not score anything. The five Cambridge
   bands (Wc /5, Wv /3, Ws /7, Wg /7, Ww /3 = 25) are teacher judgements —
   software cannot judge creation of texts or structure, and pretending
   otherwise would put a number in a gradebook that nobody stands behind. */
function evidence(){
  const story = fullStory();
  const words = story.split(/\s+/).filter(Boolean);
  const sentences = story.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  const lens = sentences.map(s => s.split(/\s+/).filter(Boolean).length);

  /* Wg — grammar and punctuation */
  const hasSpeechMarks = /["“”]/.test(story);
  const verbsUsed = U.writing.speechVerbs.filter(v => new RegExp("\\b"+v+"\\b","i").test(story));
  const lowerStarts = sentences.filter(s => /^[a-z]/.test(s)).length;
  const endsPunctuated = sentences.filter(s => /[.!?]$/.test(s)).length;

  /* Wv — vocabulary: unit words she actually used */
  const vocabUsed = U.vocab.filter(v => new RegExp("\\b"+v.w+"\\w*\\b","i").test(story)).map(v=>v.w);

  /* Ws — structure: which steps she wrote */
  const stepsDone = U.writing.steps.filter(s => (S.writing[s.key]||"").trim()).map(s=>s.label);

  /* Ww — spelling */
  const allWords = U.wordSessions.flatMap(s => s.words.map(w=>w.w));
  const mastered = allWords.filter(w => S.wordsMastered[w]);

  /* Comprehension */
  let qTotal = 0, qRight = 0, qFirstTime = 0;
  U.passages.forEach((P,pi)=>P.questions.forEach((q,qi)=>{
    const rec = S.answers["p"+pi+"q"+qi];
    qTotal++;
    if(rec && rec.correct){ qRight++; if(rec.tries === 1) qFirstTime++; }
  }));

  const vq = S.vocabQuiz;

  return {
    story, words, sentences, lens,
    Wc: [
      ["Words written", words.length],
      ["Steps of the story written", stepsDone.length + " of " + U.writing.steps.length],
      ["Setting chosen", S.writingSetting || "—"],
      ["Problem chosen", S.writingProblem || "—"],
      ["First person sustained ('I')", /\bI\b/.test(story) ? "uses 'I'" : "no first-person pronoun found"]
    ],
    Wv: [
      ["Unit words used in her writing", vocabUsed.length ? vocabUsed.join(", ") : "none"],
      ["Strong reporting verbs used", verbsUsed.length ? verbsUsed.join(", ") : "none"],
      ["Vocabulary quiz", vq.right + " correct of " + (vq.right+vq.wrong) + " attempts"]
    ],
    Ws: [
      ["Sections written", stepsDone.length ? stepsDone.join(" | ") : "none"],
      ["Number of sentences", sentences.length],
      ["Longest sentence (words)", lens.length ? Math.max.apply(null,lens) : 0],
      ["Shortest sentence (words)", lens.length ? Math.min.apply(null,lens) : 0],
      ["Long-then-short for tension", (lens.length>1 && Math.max.apply(null,lens) - Math.min.apply(null,lens) >= 6)
        ? "clear variation present" : "little variation — check with her"]
    ],
    Wg: [
      ["Speech marks used", hasSpeechMarks ? "yes" : "no"],
      ["Reporting verb other than 'said'", verbsUsed.length ? "yes (" + verbsUsed.join(", ") + ")" : "no"],
      ["Sentences starting lower-case", lowerStarts],
      ["Sentences ending with . ! or ?", endsPunctuated + " of " + sentences.length],
      ["Her own checklist ticks", U.writing.checklist.filter((_,i)=>S.writing["chk"+i]).length + " of " + U.writing.checklist.length],
      ["Grammar games finished", Object.keys(S.grammarDone).length + " of " + U.grammar.length],
      ["Grammar game answers", S.grammarQuiz.right + " correct of " + (S.grammarQuiz.right + S.grammarQuiz.wrong) + " attempts"]
    ],
    Ww: [
      ["Spelling words mastered", mastered.length + " of " + allWords.length],
      ["Words mastered", mastered.length ? mastered.join(", ") : "none"],
      ["Patterns practised", U.wordSessions.map(s=>s.pattern).join(", ")]
    ],
    comprehension: [
      ["Questions answered correctly", qRight + " of " + qTotal],
      ["Correct on the first try", qFirstTime + " of " + qTotal],
      ["Passages finished", Object.keys(S.passagesDone).length + " of " + U.passages.length]
    ]
  };
}

const BANDS = [
  ["Wc", "Creation of texts", 5],
  ["Wv", "Vocabulary & Language", 3],
  ["Ws", "Structure of texts", 7],
  ["Wg", "Grammar & punctuation", 7],
  ["Ww", "Word structure / Spelling", 3]
];

/* ===================== REPORT-CARD HELPER =====================
   Defensible numbers plus a drafted comment, built ONLY from recorded data
   with fixed sentence templates — nothing is invented or judged by software.
   "[Name]" is a placeholder: the app deliberately stores no student name.
   The teacher edits the draft before any of it reaches a report card. */
function reportData(){
  let qTotal=0, qAns=0, qRight=0, qFirst=0;
  U.passages.forEach((P,pi)=>P.questions.forEach((qq,qi)=>{
    qTotal++;
    const rec = S.answers["p"+pi+"q"+qi];
    if(rec){ qAns++; if(rec.correct){ qRight++; if(rec.tries===1) qFirst++; } }
  }));
  const allWords = U.wordSessions.flatMap(s=>s.words.map(w=>w.w));
  const vq = S.vocabQuiz, gq = S.grammarQuiz;
  const pct = (a,b)=> b ? Math.round(a/b*100) : 0;
  return {
    qTotal, qAns, qRight, qFirst,
    words:{ m: allWords.filter(w=>S.wordsMastered[w]).length, t: allWords.length },
    vocab:{ r: vq.right, t: vq.right + vq.wrong },
    gram:{ r: gq.right, t: gq.right + gq.wrong },
    days: S.daysPracticed.length,
    endings: Object.keys(S.adventure.endings).length,
    story: fullStory(), pct
  };
}

function reportComment(){
  const R = reportData();
  const p = [];
  p.push("[Name] worked on the same objectives and text types as the class, using parallel texts at an adapted readability level with audio support.");
  if(R.qAns > 0){
    const ft = R.pct(R.qFirst, R.qAns);
    let s = "She answered " + R.qRight + " of " + R.qTotal + " comprehension questions correctly, with " + ft + "% right on the first try";
    s += ft >= 80 ? ", showing secure understanding of what she reads."
       : ft >= 60 ? ", showing growing confidence with new texts."
       : "; she benefits from hearing questions read aloud before answering.";
    p.push(s);
  }
  if(R.words.t){
    p.push("In spelling she has mastered " + R.words.m + " of " + R.words.t +
      " target words across the patterns " + U.wordSessions.map(s=>s.pattern).join(", ") + ".");
  }
  if(R.vocab.t || R.gram.t){
    const bits = [];
    if(R.vocab.t) bits.push("vocabulary (" + R.pct(R.vocab.r,R.vocab.t) + "% over " + R.vocab.t + " answers)");
    if(R.gram.t) bits.push("grammar (" + R.pct(R.gram.r,R.gram.t) + "% over " + R.gram.t + " answers)");
    p.push("Her accuracy in the unit's " + bits.join(" and ") + " activities is recorded above.");
  }
  const sw = R.story.split(/\s+/).filter(Boolean).length;
  if(sw){
    p.push("Her unit story, '" + U.writing.title + "', reached " + sw + " words" +
      (/["“”]/.test(R.story) ? " and includes direct speech" : "") + ".");
  }
  if(R.days){
    p.push("She practised on " + R.days + (R.days===1 ? " day" : " days") +
      (R.endings ? " and chose to read for pleasure, collecting " + R.endings +
       (R.endings===1 ? " ending" : " endings") + " in the unit's choose-your-path story" : "") + ".");
  }
  const areas = [];
  if(R.qAns)    areas.push([R.pct(R.qFirst,R.qAns), "answering comprehension questions independently on the first try"]);
  if(R.words.t) areas.push([R.pct(R.words.m,R.words.t), "spelling the unit's target patterns"]);
  if(R.gram.t)  areas.push([R.pct(R.gram.r,R.gram.t), "applying the unit's grammar in her own writing"]);
  if(areas.length){
    areas.sort((a,b)=>a[0]-b[0]);
    p.push("Her next step is " + areas[0][1] + ".");
  }
  return p.join(" ");
}

function summaryCSV(){
  const E = evidence();
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const rows = [];
  rows.push(["Section","Item","Value"].map(q).join(","));

  rows.push(["Unit","Reference",U.oie].map(q).join(","));
  rows.push(["Unit","Writing task",U.writing.type + " — " + U.writing.title].map(q).join(","));
  rows.push(["Unit","Exported",new Date().toISOString().slice(0,10)].map(q).join(","));
  rows.push(["Unit","Adjustment","Same objectives and text type as the class; parallel texts at ~Grade 2–3 readability with audio support"].map(q).join(","));
  E.comprehension.forEach(([k,v]) => rows.push(["Comprehension",k,v].map(q).join(",")));
  /* Gradebook-shaped block: one row per number. Policy (Marc, 15 Jul 2026):
     her scores go in the same gradebook columns as the class, with the
     adaptation note recorded alongside. Writing bands stay teacher-entered. */
  const R = reportData();
  rows.push(["GRADEBOOK","Policy","Same gradebook columns as the class; record the adaptation note alongside"].map(q).join(","));
  rows.push(["GRADEBOOK","Comprehension correct", R.qRight + " of " + R.qTotal].map(q).join(","));
  rows.push(["GRADEBOOK","Comprehension first-try %", R.pct(R.qFirst,R.qAns)].map(q).join(","));
  rows.push(["GRADEBOOK","Spelling mastery %", R.pct(R.words.m,R.words.t)].map(q).join(","));
  rows.push(["GRADEBOOK","Vocabulary quiz %", R.pct(R.vocab.r,R.vocab.t)].map(q).join(","));
  rows.push(["GRADEBOOK","Grammar quiz %", R.pct(R.gram.r,R.gram.t)].map(q).join(","));
  rows.push(["GRADEBOOK","Days practised", R.days].map(q).join(","));
  rows.push(["GRADEBOOK","Writing bands Wc/Wv/Ws/Wg/Ww (/25)","TEACHER TO ENTER — Wrtng Brkdwn T1 G5"].map(q).join(","));
  BANDS.forEach(([code,name,max])=>{
    rows.push([code + " (max " + max + ")", "BAND — " + name, "score: TEACHER TO ENTER"].map(q).join(","));
    E[code].forEach(([k,v]) => rows.push([code + " (max " + max + ")", k, v].map(q).join(",")));
  });
  Object.keys(S.log).sort().forEach(d=>{
    const L = S.log[d];
    rows.push(["USAGE", d,
      "pages " + (L.pages||0) + " · listens " + (L.listens||0) + " · new words " + (L.words||0) +
      " · answers " + (L.qa||0) + " (first-try " + (L.q1||0) + ") · vocab " + (L.vr||0) + "/" + (L.va||0) +
      " · grammar " + (L.gr||0) + "/" + (L.ga||0) + " · endings " + (L.end||0)].map(q).join(","));
  });
  rows.push(["REPORT","Draft comment (edit before use)", reportComment()].map(q).join(","));
  rows.push(["Writing","Her story",E.story || "(nothing written)"].map(q).join(","));
  return rows.join("\r\n");
}

function downloadCSV(){
  S.lastExport = new Date().toISOString().slice(0,10); save();
  const name = "hub-summary-unit" + CURRENT_UNIT + "-" + new Date().toISOString().slice(0,10) + ".csv";
  const blob = new Blob(["﻿" + summaryCSV()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return name;
}

/* ===================== TEACHER: ASSESSMENT NOTES ===================== */
function viewTeacher(){
  const f = document.createDocumentFragment();
  add(f, el("h1",null,"Assessment notes (teacher)"));
  add(f, el("p","sub", U.title + " · " + U.oie));

  const o = el("section","card prose");
  add(o, el("h2",null,"Unit objectives being assessed"));
  add(o, el("p",null,"Genre: " + U.genre));
  add(o, el("p",null,"Comprehension focus: " + U.focus));
  add(o, el("p",null,"Grammar and punctuation: " + U.skills));
  add(o, el("p",null,"Access adjustment: same objectives and same text type as the class, assessed on parallel texts written at approximately Grade 2–3 readability, with audio support on every text block."));
  add(f,o);

  /* comprehension table */
  add(f, el("h2",null,"Comprehension — accuracy by question"));
  const t = el("table");
  const hr = el("tr");
  ["Passage","Question","Result","Attempts"].forEach(h=> add(hr, el("th",null,h)));
  add(t,hr);
  U.passages.forEach((P,pi)=>{
    P.questions.forEach((q,qi)=>{
      const rec = S.answers["p"+pi+"q"+qi];
      const tr = el("tr");
      add(tr, el("td",null,P.title));
      add(tr, el("td",null,q.q));
      add(tr, el("td",null, rec ? (rec.correct ? "Correct" : "Not yet") : "Not attempted"));
      add(tr, el("td",null, rec ? String(rec.tries) : "—"));
      add(t,tr);
    });
  });
  add(f,t);

  /* spelling */
  add(f, el("h2",null,"Spelling — words mastered"));
  const t2 = el("table");
  const hr2 = el("tr"); ["Pattern","Word","Mastered"].forEach(h=> add(hr2, el("th",null,h))); add(t2,hr2);
  U.wordSessions.forEach(s=>{
    s.words.forEach(w=>{
      const tr = el("tr");
      add(tr, el("td",null,s.pattern), el("td",null,w.w), el("td",null, S.wordsMastered[w.w] ? "Yes" : "—"));
      add(t2,tr);
    });
  });
  add(f,t2);

  /* vocab */
  const vq = S.vocabQuiz;
  const vtot = vq.right + vq.wrong;
  const vp = el("p","prose","Vocabulary quiz: " + vq.right + " correct out of " + vtot + " attempts" +
    (vtot ? " (" + Math.round(vq.right/vtot*100) + "%)" : "") + ".");
  add(f, el("h2",null,"Vocabulary"), vp);

  /* ---- usage by day (invisible to her; recorded from v17 onward) ---- */
  add(f, el("h2",null,"Usage by day"));
  const logDays = Object.keys(S.log).sort();
  if(!logDays.length){
    add(f, el("p","prose","No daily usage recorded yet. Recording starts with build v17 — earlier practice is in the totals above but has no daily detail."));
  } else {
    const tu = el("table");
    const hru = el("tr");
    ["Date","Pages turned","Listens","New words spelled","Answers (1st-try right)","Vocab right/answered","Grammar right/answered","Endings found"]
      .forEach(h=> add(hru, el("th",null,h)));
    add(tu,hru);
    logDays.forEach(d=>{
      const L = S.log[d];
      const tr = el("tr");
      add(tr, el("td",null,d),
          el("td",null,String(L.pages||0)),
          el("td",null,String(L.listens||0)),
          el("td",null,String(L.words||0)),
          el("td",null,(L.qa||0) + " (" + (L.q1||0) + ")"),
          el("td",null,(L.vr||0) + "/" + (L.va||0)),
          el("td",null,(L.gr||0) + "/" + (L.ga||0)),
          el("td",null,String(L.end||0)));
      add(tu,tr);
    });
    add(f,tu);
    add(f, el("p","sub","Counts only — the hub deliberately has no timers. 'Listens' is every tap of a Listen button, a rough measure of how much audio support she used."));
  }

  /* writing */
  add(f, el("h2",null,"Writing — " + U.writing.title));
  const w = el("section","card prose");
  const story = fullStory();
  const pre = el("p", null, story || "Nothing written yet.");
  pre.style.whiteSpace = "pre-wrap";
  add(w, pre);
  const wc = el("p","sub", story ? (story.split(/\s+/).filter(Boolean).length + " words") : "");
  add(w, wc);
  const wrow = el("div","btn-row");
  const cp = el("button","btn-main","Copy the story");
  cp.onclick = async ()=>{ try{ await navigator.clipboard.writeText(story); cp.textContent="Copied ✓"; }catch(e){} setTimeout(()=>cp.textContent="Copy the story",2000); };
  add(wrow, cp); add(w,wrow);
  add(f,w);

  /* ---- Evidence for the five writing bands ---- */
  add(f, el("h2",null,"Writing bands — evidence for your judgement"));
  const note = el("section","note prose");
  add(note, el("p",null,"These are facts, not scores. Creation of texts and Structure in particular cannot be judged by software, so every band is left for you to mark. Total is out of 25, matching the Wrtng Brkdwn tab."));
  add(f,note);

  const E = evidence();
  BANDS.forEach(([code,name,max])=>{
    const bc = el("section","card");
    add(bc, el("h2",null, name + " (" + code + ") — /" + max));
    const t = el("table");
    const hr = el("tr"); ["What the hub can see","Value"].forEach(h=> add(hr, el("th",null,h))); add(t,hr);
    E[code].forEach(([k,v])=>{
      const tr = el("tr");
      add(tr, el("td",null,k), el("td",null,String(v)));
      add(t,tr);
    });
    add(bc,t);
    add(bc, el("p","sub","Your score for " + code + ": ____ / " + max));
    add(f,bc);
  });

  /* ---- Report-card helper ---- */
  add(f, el("h2",null,"Report-card helper"));
  const rh = el("section","card prose");
  const R = reportData();
  add(rh, el("p","sub","Drafted from her recorded data with fixed templates — nothing is invented. Replace [Name], edit freely; the app stores no student name on purpose. Writing bands stay your judgement."));
  const tnum = el("table");
  const hrn = el("tr"); ["Defensible number","Value"].forEach(h=> add(hrn, el("th",null,h))); add(tnum,hrn);
  [
    ["Comprehension — correct", R.qRight + " of " + R.qTotal + " questions"],
    ["Comprehension — right first try", R.qFirst + " of " + R.qAns + " answered (" + R.pct(R.qFirst,R.qAns) + "%)"],
    ["Spelling mastery", R.words.m + " of " + R.words.t + " (" + R.pct(R.words.m,R.words.t) + "%)"],
    ["Vocabulary quiz accuracy", R.vocab.r + " of " + R.vocab.t + " (" + R.pct(R.vocab.r,R.vocab.t) + "%)"],
    ["Grammar game accuracy", R.gram.r + " of " + R.gram.t + " (" + R.pct(R.gram.r,R.gram.t) + "%)"],
    ["Days practised", R.days],
    ["Story endings collected", R.endings + " of " + advTotalEndings()]
  ].forEach(([k,v])=>{ const tr = el("tr"); add(tr, el("td",null,k), el("td",null,String(v))); add(tnum,tr); });
  add(rh,tnum);
  const taR = el("textarea"); taR.value = reportComment(); taR.rows = 9;
  taR.setAttribute("aria-label","Draft report comment");
  add(rh, taR);
  const rrow = el("div","btn-row");
  const rcopy = el("button","btn-main","Copy the comment");
  rcopy.onclick = async ()=>{ try{ await navigator.clipboard.writeText(taR.value); rcopy.textContent="Copied ✓"; }catch(e){} setTimeout(()=>rcopy.textContent="Copy the comment",2000); };
  const rgen = el("button",null,"Rebuild from data");
  rgen.onclick = ()=>{ taR.value = reportComment(); };
  add(rrow, rcopy, rgen); add(rh, rrow);
  add(f,rh);

  /* ---- Export ---- */
  add(f, el("h2",null,"Send it to the gradebook"));
  const ex = el("section","card prose");
  add(ex, el("p",null,"Download this summary, put the file in the English Hub folder, and tell Claude. It will be merged into 01. G5 Grdbk 2026–27.xlsx — Wrtng Brkdwn T1 G5 for the five bands, once you have decided them."));
  add(ex, el("p","sub", S.lastExport ? "Last export: " + S.lastExport : "Never exported yet. A weekly export keeps a safe copy of her progress off this laptop."));
  const exrow = el("div","btn-row");
  const dl = el("button","btn-main","Download summary for the gradebook");
  dl.onclick = ()=>{
    const n = downloadCSV();
    dl.textContent = "Saved: " + n;
    setTimeout(()=>dl.textContent = "Download summary for the gradebook", 4000);
  };
  const cp2 = el("button",null,"Copy summary instead");
  cp2.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(summaryCSV()); cp2.textContent = "Copied ✓"; }catch(e){}
    setTimeout(()=>cp2.textContent = "Copy summary instead", 2500);
  };
  add(exrow, dl, cp2); add(ex, exrow);
  add(f,ex);

  /* backup / transfer */
  add(f, el("h2",null,"Backup and transfer (teacher only)"));
  const b = el("section","card prose");
  add(b, el("p","sub","Progress saves automatically in this browser. Use this only to move progress to another computer."));
  const ta = el("textarea"); ta.value = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  ta.setAttribute("aria-label","Progress code");
  add(b,ta);
  const br = el("div","btn-row");
  const cpy = el("button",null,"Copy code");
  cpy.onclick = async ()=>{ try{ await navigator.clipboard.writeText(ta.value); cpy.textContent="Copied ✓"; }catch(e){} setTimeout(()=>cpy.textContent="Copy code",2000); };
  const paste = el("button",null,"Load pasted code");
  paste.onclick = ()=>{
    try{
      const obj = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
      S = Object.assign(clone(defaultState), obj);
      save(); applySettings(); alert("Progress loaded."); render();
    }catch(e){ alert("That code did not work. Check it was copied in full."); }
  };
  const wipe = el("button",null,"Reset all progress");
  wipe.onclick = ()=>{
    if(confirm("Erase all progress on this computer?")){
      S = clone(defaultState); save(); applySettings(); render();
    }
  };
  add(br, cpy, paste, wipe); add(b,br);
  add(f,b);

  const back = el("div","btn-row");
  const hb = el("button","btn-main","← Back to the student view");
  hb.onclick = ()=>{ SHOW_TEACHER = false; go("today"); };
  add(back,hb); add(f,back);
  return f;
}

/* ===================== RENDER ===================== */
const nav = document.getElementById("nav");
const main = document.getElementById("main");

function buildNav(){
  clear(nav);
  SECTIONS.forEach(s=>{
    if(s.key === "adventure" && !U.adventure) return;  /* unit without a story */
    const b = el("button");
    add(b, el("span","ic",s.icon), el("span",null,s.label));
    if(S.section === s.key && !SHOW_SETTINGS && !SHOW_TEACHER) b.setAttribute("aria-current","page");
    b.onclick = ()=>{
      if(s.key === "reading"){ openReadingMenu(); }     /* passage chooser */
      else if(s.key === "word"){ openWordMenu(); }       /* spelling-set chooser */
      else if(s.key === "grammar"){ openGrammarMenu(); } /* grammar-game chooser */
      else if(s.key === "adventure"){ openAdventureMenu(); } /* story menu (resume card if mid-story) */
      else go(s.key, 0);
    };
    add(nav,b);
  });
}

function render(){
  applySettings();
  buildNav();
  clear(main);

  if(SHOW_SETTINGS){ add(main, settingsPanel()); }
  else if(SHOW_TEACHER){ main.appendChild(viewTeacher()); }
  else {
    let node;
    /* Remember her place in the passage across sessions — but only a real
       reading position, never the menu or the finished screen. */
    if(VIEW.reading && (VIEW.reading.phase === "read" || VIEW.reading.phase === "quiz")){
      S.reading = VIEW.reading; save();
    }
    switch(S.section){
      case "reading": node = viewReading(); break;
      case "word":    if(!WS) startWordSession(0); node = viewWord(); break;
      case "vocab":   node = viewVocab(); break;
      case "grammar": node = viewGrammar(); break;
      case "writing": node = viewWriting(); break;
      case "adventure": node = viewAdventure(); break;
      case "wins":    node = viewWins(); break;
      default:        node = viewToday();
    }
    main.appendChild(node);
  }
  document.getElementById("unitLabel").textContent =
    U.title + " · " + U.oie + " · parallel content — teacher review before use · " + BUILD;
}

/* header controls */
document.getElementById("aPlus").onclick = ()=>{
  S.settings.fs = Math.min(30, S.settings.fs + 2); save(); applySettings();
};
document.getElementById("aMinus").onclick = ()=>{
  S.settings.fs = Math.max(16, S.settings.fs - 2); save(); applySettings();
};
document.getElementById("settingsBtn").onclick = (e)=>{
  SHOW_SETTINGS = !SHOW_SETTINGS; SHOW_TEACHER = false;
  e.currentTarget.setAttribute("aria-expanded", String(SHOW_SETTINGS));
  stopSpeech(); render(); window.scrollTo(0,0);
};
document.getElementById("teacherLink").onclick = ()=>{
  SHOW_TEACHER = true; SHOW_SETTINGS = false; stopSpeech(); render(); window.scrollTo(0,0);
};

startWordSession(0);
applySettings();
render();
</script>
